/* ---------- Chart (SVG, dataviz-konform) ---------- */
function drawChart() {
  const wrap = document.getElementById("chartwrap");
  const tip = document.getElementById("charttip");
  const k = todayKey();
  const keys = Object.keys(S.w).sort();
  if (keys.length < 2) {
    wrap.innerHTML = `<div class="emptyhint">Ab 2 Gewichts-Einträgen erscheint hier deine Kurve.<br>Erster Eintrag morgen früh — nach WC, vor dem Frühstück.</div>`;
    return;
  }
  let from = keys[0];
  if (APP.chartRange > 0) { const f = addDays(k, -APP.chartRange + 1); if (f > from) from = f; }
  const days = []; for (let d0 = from; d0 <= k; d0 = addDays(d0, 1)) days.push(d0);
  const pts = days.map(d0 => ({ d: d0, w: S.w[d0] != null ? S.w[d0] : null, a: weightAvg(d0, 7) }));
  const have = pts.filter(p0 => p0.w != null);
  if (have.length < 2) { wrap.innerHTML = `<div class="emptyhint">Zu wenig Einträge im gewählten Zeitraum.</div>`; return; }

  // Zielband: pro Phase im Sichtfenster
  const bands = [];
  PLAN.phases.filter(p0 => rateFor(p0)).forEach(p0 => {
    if (p0.to < from || p0.from > k) return;
    const inPhase = keys.filter(x => x >= p0.from && x <= p0.to);
    let startW = p0.startW;
    if (inPhase.length) startW = S.w[inPhase[0]];
    else if (startW == null) return;
    const anchor = inPhase.length ? inPhase[0] : p0.from;
    bands.push({ from: p0.from, to: p0.to, anchor, startW, r1: Math.min(...rateFor(p0)), r2: Math.max(...rateFor(p0)) });
  });
  const bandVal = (b, d0, r) => b.startW + r * (diffDays(b.anchor, d0) / 7);

  const W = Math.min(608, (document.getElementById("app").clientWidth || 360) - 32) - 16, H = 210;
  const padL = 34, padR = 40, padT = 12, padB = 22;
  let lo = Infinity, hi = -Infinity;
  pts.forEach(p0 => { if (p0.w != null) { lo = Math.min(lo, p0.w); hi = Math.max(hi, p0.w); } if (p0.a != null) { lo = Math.min(lo, p0.a); hi = Math.max(hi, p0.a); } });
  bands.forEach(b => { days.forEach(d0 => { if (d0 >= b.from && d0 <= b.to) { lo = Math.min(lo, bandVal(b, d0, b.r1), bandVal(b, d0, b.r2)); hi = Math.max(hi, bandVal(b, d0, b.r1), bandVal(b, d0, b.r2)); } }); });
  lo = Math.floor((lo - 0.4) * 2) / 2; hi = Math.ceil((hi + 0.4) * 2) / 2;
  const X = d0 => padL + (diffDays(from, d0) / Math.max(1, diffDays(from, k))) * (W - padL - padR);
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);

  // Y-Ticks: saubere Schritte
  const span = hi - lo; const step = span > 6 ? 2 : span > 3 ? 1 : 0.5;
  let ticks = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 0.001; v += step) ticks.push(Math.round(v * 10) / 10);
  // X-Labels: ~4 Stück
  const nX = Math.min(4, days.length); const xls = [];
  for (let i = 0; i < nX; i++) xls.push(days[Math.round(i * (days.length - 1) / Math.max(1, nX - 1))]);

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" id="wchart">`;
  // Zielband
  bands.forEach(b => {
    const bd = days.filter(d0 => d0 >= b.from && d0 <= b.to);
    if (bd.length < 2) return;
    const top = bd.map(d0 => X(d0).toFixed(1) + "," + Y(Math.max(bandVal(b, d0, b.r1), bandVal(b, d0, b.r2))).toFixed(1));
    const bot = bd.slice().reverse().map(d0 => X(d0).toFixed(1) + "," + Y(Math.min(bandVal(b, d0, b.r1), bandVal(b, d0, b.r2))).toFixed(1));
    svg += `<polygon points="${top.join(" ")} ${bot.join(" ")}" fill="rgba(57,135,229,0.10)"/>`;
  });
  // Grid + Y-Labels
  ticks.forEach(v => {
    svg += `<line x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${W - padR}" y2="${Y(v).toFixed(1)}" stroke="#2c2c2a" stroke-width="1"/>`;
    svg += `<text x="${padL - 6}" y="${(Y(v) + 3.5).toFixed(1)}" fill="#898781" font-size="10.5" text-anchor="end" style="font-variant-numeric:tabular-nums">${v}</text>`;
  });
  xls.forEach(d0 => { svg += `<text x="${X(d0).toFixed(1)}" y="${H - 6}" fill="#898781" font-size="10.5" text-anchor="middle">${fmtDate(d0)}</text>`; });
  // Tageswerte (muted dots mit Surface-Ring)
  pts.forEach(p0 => { if (p0.w != null) svg += `<circle cx="${X(p0.d).toFixed(1)}" cy="${Y(p0.w).toFixed(1)}" r="3.4" fill="#898781" stroke="#1a1a19" stroke-width="2"/>`; });
  // 7-Tage-Ø Linie
  const aPts = pts.filter(p0 => p0.a != null);
  if (aPts.length >= 2) {
    svg += `<polyline points="${aPts.map(p0 => X(p0.d).toFixed(1) + "," + Y(p0.a).toFixed(1)).join(" ")}" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lastA = aPts[aPts.length - 1];
    svg += `<circle cx="${X(lastA.d).toFixed(1)}" cy="${Y(lastA.a).toFixed(1)}" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>`;
    svg += `<text x="${(X(lastA.d) + 8).toFixed(1)}" y="${(Y(lastA.a) + 4).toFixed(1)}" fill="#c3c2b7" font-size="11.5" font-weight="700" style="font-variant-numeric:tabular-nums">${fmt1(lastA.a)}</text>`;
  }
  svg += `</svg>`;
  wrap.innerHTML = `<div class="charttip" id="charttip"></div>` + svg;

  // Touch/Maus-Tooltip
  const svgEl = document.getElementById("wchart");
  const tipEl = wrap.querySelector("#charttip");
  const showTip = clientX => {
    const r = svgEl.getBoundingClientRect();
    const relX = (clientX - r.left) / r.width * W;
    let best = null, bd = 1e9;
    pts.forEach(p0 => { const dx = Math.abs(X(p0.d) - relX); if (dx < bd && (p0.w != null || p0.a != null)) { bd = dx; best = p0; } });
    if (!best) return;
    tipEl.style.display = "block";
    tipEl.textContent = `${WDS[fromKey(best.d).getDay()]} ${fmtDate(best.d)} · ${best.w != null ? fmt1(best.w) + " kg" : "—"} · Ø ${best.a != null ? fmt1(best.a) : "—"}`;
  };
  svgEl.addEventListener("touchstart", e => showTip(e.touches[0].clientX), { passive: true });
  svgEl.addEventListener("touchmove", e => showTip(e.touches[0].clientX), { passive: true });
  svgEl.addEventListener("touchend", () => setTimeout(() => tipEl.style.display = "none", 3000), { passive: true });
  svgEl.addEventListener("mousemove", e => showTip(e.clientX));
  svgEl.addEventListener("mouseleave", () => tipEl.style.display = "none");
}

/* ---------- Timer ---------- */
let TMR = { int: null, end: 0, mode: null, breathStep: 0, round: 0, paused: false, left: 0 };
function beep(n) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < n; i++) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; o.type = "sine";
      const t = ctx.currentTime + i * 0.28;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.start(t); o.stop(t + 0.25);
    }
  } catch (e) { /* still */ }
}
function fmtT(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + pad2(s % 60); }
function stopTimer() { if (TMR.int) { clearInterval(TMR.int); clearTimeout(TMR.int); } TMR.int = null; TMR.mode = null; }
function sheetOpen() { return document.getElementById("sheet").classList.contains("open"); }

function openTimer(type, secs, label) {
  stopTimer();
  if (type === "pause") return startCountdown(secs || 90, "Pause", true);
  if (type === "nsdr") return startCountdown(secs || 900, label || "NSDR", false);
  if (type === "sauna") return startCountdown(secs || 600, label || "Sauna-Gang", false);
  if (type === "breath") return startBreath();
}

function startCountdown(secs, label, isPause) {
  TMR.mode = "count"; TMR.end = Date.now() + secs * 1000; TMR.paused = false;
  openSheet(`
    <div class="sheettitle">${esc(label)}</div>
    <div class="timerbig"><div class="tval" id="tval">${fmtT(secs)}</div><div class="tlab" id="tlab">läuft…</div></div>
    <div class="timerrow">
      ${isPause ? `<button class="btn ghost" id="t30">+30 s</button>` : `<button class="btn ghost" id="tpause">Pause</button>`}
      <button class="btn" id="tstop">Fertig</button>
    </div>
    ${isPause ? `<div class="note" style="text-align:center">Wechselsatz 60–75 s · Verbund 2–2½ Min · Isolation 60–90 s</div>` : ""}`);
  const tick = () => {
    const left = (TMR.end - Date.now()) / 1000;
    const tv = document.getElementById("tval");
    if (!tv) { stopTimer(); return; }
    tv.textContent = fmtT(left);
    if (left <= 0) {
      stopTimer(); beep(3);
      tv.textContent = "0:00"; tv.classList.add("donebeat");
      const tl = document.getElementById("tlab"); if (tl) tl.textContent = isPause ? "Weiter gehts — nächster Satz!" : "Fertig. Gut gemacht.";
    }
  };
  TMR.int = setInterval(tick, 250); tick();
  const t30 = document.getElementById("t30");
  if (t30) t30.addEventListener("click", () => { TMR.end += 30000; });
  const tp = document.getElementById("tpause");
  if (tp) tp.addEventListener("click", () => {
    if (!TMR.paused) { TMR.left = TMR.end - Date.now(); clearInterval(TMR.int); TMR.int = null; TMR.paused = true; tp.textContent = "Weiter"; }
    else { TMR.end = Date.now() + TMR.left; TMR.int = setInterval(tick, 250); TMR.paused = false; tp.textContent = "Pause"; }
  });
  document.getElementById("tstop").addEventListener("click", closeSheet);
}

function startBreath() {
  TMR.mode = "breath"; TMR.round = 1;
  const PH = [["Einatmen", 4, 1.35], ["Halten", 7, 1.35], ["Ausatmen", 8, 0.75]];
  openSheet(`
    <div class="sheettitle">4-7-8-Atmung</div>
    <div style="color:var(--muted);font-size:14px">5 Runden · durch die Nase ein, durch den Mund aus</div>
    <div class="breathball" id="bball" style="transform:scale(0.75)"></div>
    <div class="timerbig" style="padding-top:0"><div class="tval" id="bphase" style="font-size:34px">Bereit?</div><div class="tlab" id="bround">Runde 1/5</div></div>
    <div class="timerrow"><button class="btn" id="bstart">Start</button><button class="btn ghost" id="bstop">Schliessen</button></div>`);
  document.getElementById("bstop").addEventListener("click", closeSheet);
  document.getElementById("bstart").addEventListener("click", function () {
    this.style.display = "none";
    let phase = 0, roundN = 1;
    const ball = document.getElementById("bball"), pl = document.getElementById("bphase"), rl = document.getElementById("bround");
    const step = () => {
      if (!document.getElementById("bball") || !sheetOpen()) { stopTimer(); return; }
      if (phase >= PH.length) { phase = 0; roundN++; if (roundN > 5) { pl.textContent = "Fertig 🌙"; rl.textContent = "Gute Nacht."; ball.style.transform = "scale(0.75)"; beep(2); stopTimer(); return; } }
      const [name, secs, scale] = PH[phase];
      pl.textContent = name + " · " + secs;
      rl.textContent = "Runde " + roundN + "/5";
      ball.style.transition = "transform " + secs + "s ease-in-out";
      ball.style.transform = "scale(" + scale + ")";
      let remain = secs;
      const cd = setInterval(() => { remain--; if (remain > 0) pl.textContent = name + " · " + remain; else clearInterval(cd); }, 1000);
      phase++;
      TMR.int = setTimeout(step, secs * 1000);
    };
    step();
    beep(1);
  });
}

  ws.days.forEach(d0 => {
    const wo = S.wo[d0];
    if (!wo || !wo.ex || !Object.keys(wo.ex).length) return;
    const sess = SESSIONS[wo.sess];
    lines.push(WDS[fromKey(d0).getDay()] + " " + fmtDate(d0) + " — " + (sess ? sess.name : "?") + (wo.done ? " ✓" : " (offen)"));
    Object.keys(wo.ex).forEach(exId => {
      const sets = (wo.ex[exId].sets || []).filter(s => s[0] != null || s[1] != null);
      if (sets.length) lines.push("  " + (EXERCISES[exId] ? EXERCISES[exId].name : exId) + ": " + fmtSets(sets));
    });
  });
  const setups = Object.keys(S.setup).filter(x => S.setup[x]);
  if (setups.length) { lines.push(""); lines.push("SETUPS: " + setups.map(x => (EXERCISES[x] ? EXERCISES[x].name : x) + " → " + S.setup[x]).join(" · ")); }
  return lines.join("\n");
}
function openExport() {
  const txt = buildExport();
  openSheet(`
    <div class="sheettitle">Wochen-Export</div>
    <div style="color:var(--muted);font-size:13.5px;margin-bottom:10px">Kopieren → im Sonntags-Check-in einfügen.</div>
    <textarea class="exportbox" id="exptxt" readonly>${esc(txt)}</textarea>
    <div class="timerrow">
      <button class="btn" id="expcopy">Kopieren</button>
      ${navigator.share ? `<button class="btn ghost" id="expshare">Teilen</button>` : ""}
    </div>
    ${bkStatus().warn ? `<div class="note" id="expbknote"><span data-bkstat>${esc(bkStatus().txt)}</span> <button class="minibtn blue" id="expbk">Jetzt sichern</button></div>` : ""}
    <button class="btn ghost" onclick="closeSheet()">Schliessen</button>`);
  document.getElementById("expcopy").addEventListener("click", async function () {
    const ta = document.getElementById("exptxt");
    try { await navigator.clipboard.writeText(ta.value); this.textContent = "✓ Kopiert"; }
    catch (e) { ta.removeAttribute("readonly"); ta.select(); document.execCommand("copy"); ta.setAttribute("readonly", ""); this.textContent = "✓ Kopiert"; }
  });
  const sh = document.getElementById("expshare");
  if (sh) sh.addEventListener("click", () => navigator.share({ title: "Wochen-Review", text: document.getElementById("exptxt").value }).catch(() => {}));
  const eb = document.getElementById("expbk");
  if (eb) eb.addEventListener("click", async function () {
    const r = await bkSaveFile();
    if (r === "ok") { this.remove(); bkStatRefresh(); }
    else if (r === "fail") this.textContent = "Ging nicht — im Backup-Sheet versuchen";
  });
}

/* ---------- Backup ---------- */
/* Datei-Format: { app, kind, fv, at, data } — data ist der ganze Zustand S. Ältere Text-Backups (nur S) werden ebenfalls gelesen.
   Nicht im Backup: der Strava-Zugang (SV_KEY) und der Zeitpunkt des letzten Backups (BK_KEY). */
const BK_KEY = LS_KEY + "_backup", BK_APP = "sommerbody2027", BK_MAX = 25 * 1048576;
function bkLast() {
  try { const o = JSON.parse(localStorage.getItem(BK_KEY) || "null"); if (o && o.at) { const d = new Date(o.at); if (!isNaN(d)) return d; } } catch (e) { /* Speicher gesperrt */ }
  return APP.bkAt || null;
}
function bkMark() { APP.bkAt = new Date(); try { localStorage.setItem(BK_KEY, JSON.stringify({ at: APP.bkAt.toISOString() })); } catch (e) { /* bleibt für die Sitzung */ } }
function bkHasData(o) { return ["w", "wo", "sleep", "steps", "waist", "health"].some(k => o[k] && typeof o[k] === "object" && Object.keys(o[k]).length > 0); }
function bkHm(d) { return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function bkStatus() {
  const at = bkLast(), any = bkHasData(S);
  if (!at) return { txt: any ? "Noch kein Backup auf diesem Gerät." : "Noch keine Daten zum Sichern.", warn: any };
  const n = diffDays(dkey(at), todayKey());
  return { txt: "Letztes Backup: " + (n <= 0 ? "heute, " + bkHm(at) : n === 1 ? "gestern, " + bkHm(at) : "vor " + n + " Tagen (" + fmtDate(dkey(at)) + ")"), warn: any && n >= 7 };
}
function bkStatHtml(extra) { const b = bkStatus(); return `<div data-bkstat style="font-size:14px;color:${b.warn ? "var(--warn)" : "var(--ink2)"}${extra ? ";" + extra : ""}">${esc(b.txt)}</div>`; }
function bkStatRefresh() { const b = bkStatus(); document.querySelectorAll("[data-bkstat]").forEach(e => { e.textContent = b.txt; if (e.tagName === "DIV") e.style.color = b.warn ? "var(--warn)" : "var(--ink2)"; }); }
function bkKb(n) { return n >= 1048576 ? fmt1(n / 1048576) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
function bkJson() { return JSON.stringify({ app: BK_APP, kind: "backup", fv: 1, at: new Date().toISOString(), data: S }); }
function bkName() { return "sommerbody-backup-" + todayKey() + ".json"; }

/* Als Datei sichern: auf dem iPhone über das Teilen-Menü («In Dateien sichern»), sonst als Download.
   Ergebnis: "ok", "abort" (im Teilen-Menü abgebrochen) oder "fail". */
async function bkSaveFile() {
  const json = bkJson(), name = bkName();
  let file = null;
  try { file = new File([json], name, { type: "application/json" }); } catch (e) { /* alter Browser */ }
  const touch = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
  if (file && touch && navigator.share && navigator.canShare) {
    let can = false;
    try { can = navigator.canShare({ files: [file] }); } catch (e) { /* nein */ }
    if (can) {
      try { await navigator.share({ files: [file] }); bkMark(); return "ok"; }
      catch (e) { if (e && e.name === "AbortError") return "abort"; /* sonst als Download versuchen */ }
    }
  }
  try {
    const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener"; a.style.display = "none";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) { /* egal */ } }, 60000);
    bkMark(); return "ok";
  } catch (e) { return "fail"; }
}

const BK_ERR = {
  empty: "Die Datei ist leer.", read: "Die Datei liess sich nicht lesen. Nochmals wählen.",
  json: "Das ist keine Backup-Datei der App.", other: "Diese Datei stammt nicht aus der Sommerbody-App.",
  zip: "Das ist eine ZIP-Datei. Der Gesamt-Export aus Apple Health gehört unter Heute → Apple Health → Gesamt-Export.",
  big: "Die Datei ist zu gross für ein Backup der App. Ist es der Gesamt-Export aus Apple Health? Der gehört unter Heute → Apple Health.",
  newer: "Dieses Backup stammt aus einer neueren Version der App. Zuerst die App aktualisieren.",
  field: "Das Backup ist beschädigt: «%» hat ein unerwartetes Format."
};
function bkErr(code, field) { const e = new Error(code); e.field = field; return e; }
function bkErrText(e) { const c = e && e.message; return c === "field" ? BK_ERR.field.replace("%", e.field) : (Object.prototype.hasOwnProperty.call(BK_ERR, c) ? BK_ERR[c] : BK_ERR.read); }
/* Text prüfen und in einen Zustand umwandeln. Wirft bkErr(code) bei allem, was nicht sicher übernommen werden kann. */
function bkParse(txt) {
  txt = String(txt == null ? "" : txt).replace(/^﻿/, "").trim();
  if (!txt) throw bkErr("empty");
  if (txt.slice(0, 2) === "PK") throw bkErr("zip");
  let o;
  try { o = JSON.parse(txt); } catch (e) { throw bkErr("json"); }
  let at = null;
  if (o && typeof o === "object" && !Array.isArray(o) && Object.prototype.hasOwnProperty.call(o, "app")) {
    if (o.app !== BK_APP) throw bkErr("other");
    if (o.at) { const d = new Date(o.at); if (!isNaN(d)) at = d; }
    o = o.data;
  }
  if (!o || typeof o !== "object" || Array.isArray(o)) throw bkErr("other");
  const isObj = x => !!x && typeof x === "object" && !Array.isArray(x);
  if (typeof o.v !== "number" || !(isObj(o.w) || isObj(o.wo))) throw bkErr("other");
  const d = defaultState();
  if (o.v > d.v) throw bkErr("newer");
  for (const k in d) {
    if (o[k] === null) { delete o[k]; continue; }
    if (o[k] === undefined) continue;
    const kind = x => Array.isArray(x) ? "array" : typeof x;
    if (kind(o[k]) !== kind(d[k])) throw bkErr("field", k);
  }
  let size = txt.length;
  try { size = new Blob([txt]).size; } catch (e) { /* Zeichenzahl genügt */ }
  return { s: migrateState(o), at: at, size: size };
}
function bkRead(file) {
  return new Promise((ok, no) => {
    try { const r = new FileReader(); r.onload = () => ok(String(r.result || "")); r.onerror = () => no(bkErr("read")); r.readAsText(file); }
    catch (e) { no(bkErr("read")); }
  });
}
/* Kennzahlen für die Vorschau */
function bkSpan(o) {
  const tk = todayKey(); let first = null, last = null;
  Object.keys(o).forEach(k => {
    const v = o[k]; if (!v || typeof v !== "object" || Array.isArray(v)) return;
    Object.keys(v).forEach(x => { if (!/^\d{4}-\d{2}-\d{2}$/.test(x) || x > tk) return; if (!first || x < first) first = x; if (!last || x > last) last = x; });
  });
  return { first: first, last: last };
}
function bkCounts(o) {
  const n = k => o[k] && typeof o[k] === "object" ? Object.keys(o[k]).length : 0;
  return [["Gewicht", n("w"), " Tage"], ["Trainings", n("wo"), ""], ["Schlaf", n("sleep"), " Nächte"], ["Apple Health", n("health"), " Tage"],
    ["Strava", o.strava && o.strava.acts && typeof o.strava.acts === "object" ? Object.keys(o.strava.acts).length : 0, " Aktivitäten"]];
}

/* Haupt-Sheet */
function openBackup(msg) {
  msg = typeof msg === "string" ? msg : "";   // als Klick-Handler kommt hier der Event an
  const b = bkStatus();
  let size = 0; try { size = new Blob([JSON.stringify(S)]).size; } catch (e) { size = JSON.stringify(S).length; }
  openSheet(`
    <div class="sheettitle">Backup</div>
    ${bkStatHtml("margin-bottom:6px")}
    <div id="bkmsg" style="color:var(--warn);font-size:14px;margin-bottom:6px;${msg ? "" : "display:none"}">${msg ? esc(msg) : ""}</div>
    <button class="btn" id="bksave">Als Datei sichern</button>
    <input type="file" id="bkfile" accept=".json,application/json,text/plain" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" tabindex="-1" aria-hidden="true">
    <label class="btn ghost" id="bkpick" for="bkfile" role="button" tabindex="0" style="display:block;text-align:center;cursor:pointer;box-sizing:border-box">Backup-Datei laden</label>
    <div class="note">Die Datei (${bkKb(size)}) enthält alle Einträge samt Health- und Strava-Werten, nicht aber den Strava-Zugang. Auf dem iPhone im Teilen-Menü «In Dateien sichern» und iCloud Drive wählen.</div>
    ${APP.bkPrev ? `<button class="btn ghost" id="bkundo2">Letzte Übernahme rückgängig machen</button>` : ""}
    <div class="divider"></div>
    <div class="row" style="justify-content:space-between"><span style="font-size:14px;color:var(--ink2)">Als Text (Notizen-App, Chat)</span><button class="minibtn" id="bktxtbtn">Anzeigen</button></div>
    <div id="bktxtwrap" style="display:none">
      <textarea class="exportbox" id="bktxt" style="margin-top:10px" placeholder="Backup-Text hier einfügen zum Wiederherstellen …"></textarea>
      <div class="timerrow">
        <button class="btn ghost" id="bkcopy">Text kopieren</button>
        <button class="btn ghost" id="bkrestore">Aus Text laden</button>
      </div>
    </div>
    <div class="divider"></div>
    <button class="btn ghost" id="bkreset" style="color:var(--crit)">Alle Daten löschen</button>
    <button class="btn ghost" id="bkclose">Schliessen</button>`);
  const showMsg = t => { const m = document.getElementById("bkmsg"); if (!m) return; m.textContent = t; m.style.display = t ? "" : "none"; };
  document.getElementById("bksave").addEventListener("click", async function () {
    showMsg("");
    const r = await bkSaveFile();
    if (r === "ok") { this.textContent = "✓ Gesichert"; bkStatRefresh(); }
    else if (r === "fail") showMsg("Sichern als Datei geht hier nicht. Unten «Als Text» verwenden.");
  });
  const inp = document.getElementById("bkfile");
  document.getElementById("bkpick").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); inp.click(); } });
  inp.addEventListener("change", async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    showMsg("");
    try {
      if (/\.zip$/i.test(f.name || "")) throw bkErr("zip");
      if (f.size > BK_MAX) throw bkErr("big");
      const p = bkParse(await bkRead(f));
      bkConfirm(p);
    } catch (e) { inp.value = ""; showMsg(bkErrText(e)); }
  });
  const u2 = document.getElementById("bkundo2");
  if (u2) u2.addEventListener("click", bkUndo);
  document.getElementById("bktxtbtn").addEventListener("click", function () {
    const w = document.getElementById("bktxtwrap"), open = w.style.display === "none";
    w.style.display = open ? "" : "none"; this.textContent = open ? "Ausblenden" : "Anzeigen";
  });
  document.getElementById("bkcopy").addEventListener("click", async function () {
    const data = bkJson(), ta = document.getElementById("bktxt");
    ta.value = data;
    try { await navigator.clipboard.writeText(data); this.textContent = "✓ Kopiert (" + bkKb(data.length) + ")"; bkMark(); bkStatRefresh(); }
    catch (e) { ta.select(); this.textContent = "Text oben von Hand kopieren"; }
  });
  document.getElementById("bkrestore").addEventListener("click", function () {
    showMsg("");
    try { bkConfirm(bkParse(document.getElementById("bktxt").value)); }
    catch (e) { showMsg(bkErrText(e)); }
  });
  let armed = false;
  document.getElementById("bkreset").addEventListener("click", function () {
    if (!armed) { armed = true; this.textContent = "Sicher? Nochmals tippen zum endgültigen Löschen"; return; }
    S = defaultState(); try { localStorage.removeItem(SV_KEY); localStorage.removeItem(BK_KEY); } catch (e) { /* egal */ } APP.sv = {}; APP.bkAt = null; APP.bkPrev = null; save(); closeSheet(); renderAll();
  });
  document.getElementById("bkclose").addEventListener("click", closeSheet);
}

/* Vorschau vor dem Ersetzen */
function bkConfirm(p) {
  const had = bkHasData(S), cur = bkCounts(S), nw = bkCounts(p.s), cs = bkSpan(S), ns = bkSpan(p.s);
  const rows = nw.map((r, i) => (r[1] || (had && cur[i][1])) ? `<div class="kv"><span class="k">${r[0]}</span><span class="v">${r[1]}${r[2]}${had ? ` <span style="color:var(--muted);font-weight:500">· jetzt ${cur[i][1]}</span>` : ""}</span></div>` : "").join("");
  const lose = had && cs.last && (!ns.last || cs.last > ns.last);
  openSheet(`
    <div class="sheettitle">Backup übernehmen?</div>
    <div style="color:var(--muted);font-size:13.5px;margin-bottom:10px">${had ? "Ersetzt alle Daten auf diesem Gerät durch den Stand im Backup." : "Auf diesem Gerät sind noch keine Daten. Das Backup wird übernommen."}</div>
    <div class="card">
      <div class="kv"><span class="k">Gesichert</span><span class="v">${p.at ? fmtDateY(dkey(p.at)) + ", " + bkHm(p.at) : "unbekannt (älteres Text-Backup)"}</span></div>
      <div class="kv"><span class="k">Zeitraum</span><span class="v">${ns.first ? fmtDateY(ns.first) + " – " + fmtDateY(ns.last) : "keine Einträge"}</span></div>
      ${rows}
      <div class="kv"><span class="k">Grösse</span><span class="v">${bkKb(p.size)}</span></div>
    </div>
    ${lose ? `<div class="banner warn"><span class="ic">⚠️</span><span>Auf dem Gerät gibt es Einträge bis <b>${fmtDate(cs.last)}</b>, im Backup ${ns.last ? "nur bis " + fmtDate(ns.last) : "keine"}. Was dazwischen liegt, geht verloren.</span></div>` : ""}
    <button class="btn" id="bkapply">${had ? "Ersetzen" : "Übernehmen"}</button>
    ${had ? `<button class="btn ghost" id="bkfirst">Zuerst aktuellen Stand sichern</button>` : ""}
    <button class="btn ghost" id="bkcancel">Abbrechen</button>`);
  document.getElementById("bkapply").addEventListener("click", () => bkApply(p));
  const f = document.getElementById("bkfirst");
  if (f) f.addEventListener("click", async function () {
    const r = await bkSaveFile();
    if (r === "ok") { this.textContent = "✓ Aktueller Stand gesichert"; this.disabled = true; }
    else if (r === "fail") this.textContent = "Sichern ging nicht";
  });
  document.getElementById("bkcancel").addEventListener("click", () => openBackup());
}
function bkApply(p) {
  APP.bkPrev = JSON.stringify(S);
  S = p.s; save(); saveNow(); renderAll();
  const ok = storageOK, sv = p.s.strava && Object.keys(p.s.strava.acts || {}).length && !svOn();
  openSheet(`
    <div class="sheettitle">${ok ? "✓ Backup übernommen" : "Backup geladen, aber nicht gespeichert"}</div>
    <div style="color:${ok ? "var(--muted)" : "var(--warn)"};font-size:14px;margin-bottom:10px">${ok
      ? "Alle Tabs zeigen jetzt den Stand " + (p.at ? "vom " + fmtDate(dkey(p.at)) : "aus dem Backup") + "." + (sv ? " Strava auf diesem Gerät neu verbinden, dann gleicht die App wieder ab." : "")
      : "Der Speicher dieses Geräts nimmt die Daten nicht an. Sie gelten nur, solange die App offen ist; beim nächsten Öffnen ist wieder der alte Stand da."}</div>
    <button class="btn" id="bkok">Fertig</button>
    <button class="btn ghost" id="bkundo">Rückgängig</button>`);
  document.getElementById("bkok").addEventListener("click", closeSheet);
  document.getElementById("bkundo").addEventListener("click", bkUndo);
}
function bkUndo() {
  if (!APP.bkPrev) { closeSheet(); return; }
  S = migrateState(JSON.parse(APP.bkPrev)); APP.bkPrev = null;
  save(); saveNow(); renderAll();
  openSheet(`
    <div class="sheettitle">Zurück auf dem alten Stand</div>
    <div style="color:var(--muted);font-size:14px;margin-bottom:10px">Die Daten sind wieder so wie vor dem Laden des Backups.</div>
    <button class="btn ghost" id="bkok">Schliessen</button>`);
  document.getElementById("bkok").addEventListener("click", closeSheet);
}

/* ---------- Init ---------- */
function init() {
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
  document.getElementById("sheetbg").addEventListener("click", closeSheet);
  renderAll();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { if (hpTake()) healthPasteSheet(); svAuto(); } });
  if (svCallback()) return;
  if (hpTake()) healthPasteSheet();
  svAuto();
}
document.addEventListener("DOMContentLoaded", init);

</script>
</body>
