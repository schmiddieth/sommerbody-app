<style>
/* ============ Sommerbody 2027 — iOS Dark Design ============ */
:root {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface2: #232322;
  --ink: #ffffff;
  --ink2: #c3c2b7;
  --muted: #898781;
  --hairline: rgba(255,255,255,0.10);
  --grid: #2c2c2a;
  --blue: #3987e5;
  --blue-dim: rgba(57,135,229,0.16);
  --aqua: #199e70;
  --aqua-dim: rgba(25,158,112,0.16);
  --good: #0ca30c;
  --warn: #fab219;
  --warn-dim: rgba(250,178,25,0.14);
  --crit: #d03b3b;
  --r: 16px;
  --tabbar-h: 78px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--page); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.45;
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink); }
a { color: var(--blue); text-decoration: none; }

/* ---------- Layout ---------- */
#app { max-width: 640px; margin: 0 auto; padding: 0 16px; }
.screen { display: none; padding-top: calc(10px + env(safe-area-inset-top)); animation: fade .18s ease; }
.screen.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.ltitle { font-size: 30px; font-weight: 800; letter-spacing: -0.4px; margin: 8px 0 2px; }
.lsub { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
h2.sec { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin: 22px 0 8px 4px; }

.card {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px;
}
.card.pad0 { padding: 0; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.tright { text-align: right; }

/* ---------- Chips, Banner, Badges ---------- */
.chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
.chip.blue { background: var(--blue-dim); color: var(--blue); }
.chip.aqua { background: var(--aqua-dim); color: var(--aqua); }
.chip.warn { background: var(--warn-dim); color: var(--warn); }
.chip.ghost { background: var(--surface2); color: var(--ink2); }
.banner { border-radius: 14px; padding: 11px 14px; margin-bottom: 10px; font-size: 14.5px; display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--hairline); }
.banner .ic { font-size: 17px; line-height: 1.3; }
.banner.warn { background: var(--warn-dim); color: #ffd97a; }
.banner.blue { background: var(--blue-dim); color: #9cc4f2; }
.banner.aqua { background: var(--aqua-dim); color: #7fd0b0; }
.banner b { color: var(--ink); }
#storagebadge { display: none; background: var(--warn-dim); color: var(--warn); font-size: 13px; padding: 8px 14px; border-radius: 12px; margin-bottom: 10px; }

/* ---------- Checkliste ---------- */
.check { display: flex; align-items: center; gap: 13px; padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
.check:last-child { border-bottom: none; }
.cbox {
  width: 28px; height: 28px; min-width: 28px; border-radius: 50%;
  border: 2px solid var(--grid); display: flex; align-items: center; justify-content: center;
  transition: all .15s; font-size: 15px; color: transparent;
}
.check.on .cbox { background: var(--good); border-color: var(--good); color: #fff; }
.check .t { font-size: 16px; font-weight: 600; }
.check .d { font-size: 13px; color: var(--muted); }
.check.on .t { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(255,255,255,0.35); }
.check .time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- Inputs ---------- */
.numrow { display: flex; align-items: center; gap: 8px; }
.numrow input {
  width: 82px; text-align: center; background: var(--surface2); border: 1px solid var(--hairline);
  border-radius: 12px; padding: 9px 6px; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;
  -moz-appearance: textfield; appearance: textfield;
}
.numrow input::-webkit-inner-spin-button { display: none; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.45; }
.numrow input:focus { outline: none; border-color: var(--blue); }
.stepbtn {
  width: 38px; height: 38px; min-width: 38px; border-radius: 12px; background: var(--surface2);
  border: 1px solid var(--hairline); font-size: 19px; font-weight: 700; color: var(--ink2);
  display: flex; align-items: center; justify-content: center;
}
.stepbtn:active { background: var(--grid); }
.unit { color: var(--muted); font-size: 14px; }

.btn {
  display: block; width: 100%; text-align: center; padding: 13px; border-radius: 14px;
  font-size: 16px; font-weight: 700; background: var(--blue); color: #fff; margin-top: 10px;
}
.btn:active { opacity: .85; }
.btn.ghost { background: var(--surface2); color: var(--ink); border: 1px solid var(--hairline); }
.btn.aqua { background: var(--aqua); }
.btn.small { display: inline-block; width: auto; padding: 8px 14px; font-size: 14px; margin-top: 0; }
.btn.done { background: var(--surface2); color: var(--good); border: 1px solid rgba(12,163,12,0.4); }

/* Qualität 1–5 */
.qrow { display: flex; gap: 6px; }
.qbtn { width: 40px; height: 40px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--hairline); font-weight: 700; color: var(--muted); }
.qbtn.on { background: var(--blue); border-color: var(--blue); color: #fff; }

/* Segmented control */
.seg { display: flex; background: var(--surface2); border-radius: 12px; padding: 3px; gap: 2px; margin-bottom: 12px; }
.seg button { flex: 1; padding: 8px 4px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.4); }

/* ---------- Training ---------- */
.sessrow { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--hairline); }
.sessrow:last-child { border-bottom: none; }
.sessrow .day { width: 34px; font-size: 13px; font-weight: 800; color: var(--muted); }
.sessrow.today .day { color: var(--blue); }
.sessrow .nm { font-weight: 650; font-size: 15.5px; }
.sessrow .meta { font-size: 12.5px; color: var(--muted); }
.sessrow .st { margin-left: auto; font-size: 13px; color: var(--muted); }
.sessrow .st.ok { color: var(--good); font-weight: 700; }
.chev { color: var(--grid); font-size: 20px; font-weight: 600; }

.excard { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; }
.exhead { padding: 13px 16px 10px; }
.exhead .nr { font-size: 12px; color: var(--muted); font-weight: 700; }
.exhead .nm { font-size: 17px; font-weight: 750; letter-spacing: -0.2px; }
.exhead .target { font-size: 13.5px; color: var(--ink2); margin-top: 1px; }
.exhead .last { font-size: 13px; color: var(--blue); margin-top: 3px; font-variant-numeric: tabular-nums; }
.exhead .startw { font-size: 13px; color: var(--muted); margin-top: 3px; }
.setrow { display: flex; align-items: center; gap: 8px; padding: 7px 16px; }
.setrow .snr { width: 20px; font-size: 13px; color: var(--muted); font-weight: 700; }
.setrow input { width: 64px; }
.setrow .x { color: var(--muted); font-size: 13px; }
.setok { width: 34px; height: 34px; min-width: 34px; border-radius: 50%; border: 2px solid var(--grid); color: transparent; font-size: 14px; margin-left: auto; display: flex; align-items: center; justify-content: center; }
.setok.on { background: var(--good); border-color: var(--good); color: #fff; }
.exfoot { display: flex; gap: 8px; padding: 9px 16px 13px; flex-wrap: wrap; }
.minibtn { padding: 7px 12px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--hairline); font-size: 13px; font-weight: 600; color: var(--ink2); }
.minibtn:active { background: var(--grid); }
.minibtn.blue { color: var(--blue); }
.exdetail { border-top: 1px solid var(--hairline); padding: 12px 16px; font-size: 14px; color: var(--ink2); display: none; }
.exdetail.open { display: block; }
.exdetail h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin: 10px 0 3px; }
.exdetail h4:first-child { margin-top: 0; }
.exdetail .ok { color: #7fd0b0; }
.exdetail .no { color: #e8a1a1; }
.exhead .cue { font-size: 13.5px; color: var(--aqua); font-weight: 600; margin-top: 4px; }
.exdetail .tallrow, .exdetail .shldrow { background: var(--surface2); border: 1px solid var(--hairline); border-radius: 8px; padding: 8px 11px; }
.exdetail ol.steps { margin: 2px 0 0 20px; padding: 0; }
.exdetail ol.steps li { margin-bottom: 5px; }
.setupnote { width: 100%; background: var(--surface2); border: 1px solid var(--hairline); border-radius: 10px; padding: 9px 11px; font-size: 14px; margin-top: 6px; min-height: 40px; resize: vertical; }
.setupnote:focus { outline: none; border-color: var(--blue); }

/* ---------- Ernährung ---------- */
.menurow { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--hairline); }
.menurow:last-child { border-bottom: none; }
.menurow .nr { font-size: 12px; color: var(--muted); width: 20px; font-weight: 700; }
.menurow .nm { font-size: 15px; font-weight: 620; }
.menurow .meta { font-size: 12.5px; color: var(--muted); }
.cattag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-left: auto; white-space: nowrap; }
.cattag.fisch { background: var(--blue-dim); color: var(--blue); }
.cattag.fleisch { background: rgba(217,89,38,0.16); color: #e5906a; }
.cattag.pflanzlich { background: var(--aqua-dim); color: var(--aqua); }

/* ---------- Erholung ---------- */
.reccard .fr { font-size: 13px; color: var(--aqua); font-weight: 650; margin-bottom: 6px; }
.reccard ul { margin: 4px 0 4px 18px; font-size: 14.5px; color: var(--ink2); }
.reccard li { margin-bottom: 4px; }
.weektable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.weektable td { padding: 8px 10px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
.weektable tr:last-child td { border-bottom: none; }
.weektable .wd { font-weight: 800; color: var(--muted); width: 34px; }
.weektable .tr { font-weight: 600; }
.weektable .rec { color: var(--aqua); font-size: 12.5px; }

/* ---------- Fortschritt ---------- */
.hero { text-align: left; padding: 18px 16px; }
.hero .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
.hero .val { font-size: 46px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
.hero .val small { font-size: 22px; color: var(--muted); font-weight: 700; }
.hero .delta { font-size: 14px; font-weight: 650; margin-top: 2px; }
.delta.down { color: var(--aqua); }
.delta.up { color: var(--blue); }
.delta.flat { color: var(--muted); }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.stat { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r); padding: 12px 14px; }
.stat .lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.stat .val { font-size: 22px; font-weight: 750; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 12px; color: var(--muted); }
.chartwrap { position: relative; }
.charttip { position: absolute; top: 8px; left: 12px; background: var(--surface2); border: 1px solid var(--hairline); border-radius: 10px; padding: 6px 10px; font-size: 12.5px; color: var(--ink2); display: none; pointer-events: none; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); padding: 2px 4px 8px; flex-wrap: wrap; }
.legend .k { display: flex; align-items: center; gap: 5px; }
.lk { width: 14px; height: 3px; border-radius: 2px; background: var(--blue); }
.lk.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.lk.band { width: 14px; height: 9px; border-radius: 3px; background: var(--blue-dim); }
.tl { position: relative; padding-left: 20px; }
.tl::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--grid); border-radius: 2px; }
.tlrow { position: relative; padding: 7px 0; }
.tlrow::before { content: ""; position: absolute; left: -19px; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: var(--grid); }
.tlrow.next::before { background: var(--blue); }
.tlrow.past::before { background: var(--good); }
.tlrow .d { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tlrow .l { font-weight: 650; font-size: 14.5px; }
.tlrow .dt { font-size: 13px; color: var(--muted); }

/* ---------- Tab-Bar ---------- */
#tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  background: rgba(13,13,13,0.82); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-top: 1px solid var(--hairline);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  display: flex; justify-content: space-around;
}
.tab { flex: 1; max-width: 110px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 2px; color: var(--muted); border-radius: 12px; }
.tab svg { width: 25px; height: 25px; }
.tab .tl2 { font-size: 10.5px; font-weight: 650; }
.tab.on { color: var(--blue); }

/* ---------- Sheets / Modals ---------- */
#sheetbg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 90; display: none; }
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 95; display: none;
  background: var(--surface); border-radius: 22px 22px 0 0; border-top: 1px solid var(--hairline);
  padding: 14px 20px calc(24px + env(safe-area-inset-bottom));
  max-width: 640px; margin: 0 auto; max-height: 86vh; overflow-y: auto;
}
#sheet.open, #sheetbg.open { display: block; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--grid); margin: 0 auto 14px; }
.sheettitle { font-size: 20px; font-weight: 750; margin-bottom: 4px; }

/* Timer */
.timerbig { text-align: center; padding: 18px 0 6px; }
.timerbig .tval { font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
.timerbig .tlab { font-size: 15px; color: var(--muted); font-weight: 600; }
.timerrow { display: flex; gap: 10px; margin-top: 14px; }
.timerrow .btn { flex: 1; margin-top: 0; }
.breathball {
  width: 150px; height: 150px; border-radius: 50%; margin: 18px auto 8px;
  background: radial-gradient(circle at 35% 30%, rgba(57,135,229,0.85), rgba(25,158,112,0.55));
  transition: transform 1s linear; box-shadow: 0 0 60px rgba(57,135,229,0.35);
}
.donebeat { animation: beat .5s ease 2; }
@keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

.subhead { display: flex; align-items: center; gap: 10px; margin: 6px 0 12px; }
.backbtn { width: 36px; height: 36px; min-width: 36px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--hairline); font-size: 18px; color: var(--blue); display: flex; align-items: center; justify-content: center; }
.subhead .t { font-size: 21px; font-weight: 750; letter-spacing: -0.3px; }
.subhead .s { font-size: 13px; color: var(--muted); }

.kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--hairline); font-size: 14.5px; }

function pxAllowed(k) { const r = restdayFor(k)[fromKey(k).getDay()]; return k >= PLAN_SWITCH && !isTrainDay(k) && !!(r && r.px); }
function pxDoneWeek(k) { const mon = mondayOf(k); for (let i = 0; i < 7; i++) { const d = addDays(mon, i), w = S.wo[d]; if (d !== k && w && w.done && w.sess === "px") return d; } return null; }
function weekplanFor(k) { return k < PLAN_SWITCH ? WEEKPLAN_OLD : WEEKPLAN; }
function restdayFor(k) { return k < PLAN_SWITCH ? RESTDAY_OLD : RESTDAY; }
function sessKeyFor(k) { return weekplanFor(k)[fromKey(k).getDay()]; }
/* Training v4 (Oberkörper-Fokus): ab der Woche vom 19.10.2026 zählt die Pump-Session fix ins Wochen-Soll (5 statt 4) */
const V4_WEEK = "2026-10-19", V4_BANNER = ["2026-10-22", "2026-11-01"];
function isV4Week(k) { return mondayOf(k) >= V4_WEEK; }

function pxPending(k) { return isV4Week(k) && pxAllowed(k) && !pxDoneWeek(k) && !(S.wo[k] && S.wo[k].sess === "px" && S.wo[k].done); }

function mealFor(k, slot) {

  if (m && MEALS[m]) return m;
  if (k < MEAL_SWITCH) return "topf";
  const d = S.mealDef && S.mealDef[slot];
  return d && MEALS[d] ? d : (slot === "T1" ? "quinoa" : "pasta");
}
/* Inhalt einer Hauptmahlzeit; der Standard-Topf folgt Phase und Stufe */
function mealInfo(id, n) {
  const M = MEALS[id] || MEALS.topf;
  if (id === "topf" || !MEALS[id]) return { id: "topf", name: M.name, short: M.short, kcal: n.T.kcal, p: n.T.p,
    desc: "⅓ Standard-Topf (" + n.reis + " Tassen Reis pro Charge" + (n.dense ? ", ohne Bohnen, 40 g Öl" : "") + ")", sub: "⅓ von 3 Portionen" };
  return { id: id, name: M.name, short: M.short, kcal: M.kcal, p: M.p, desc: M.portions > 1 ? "¼ " + M.full : M.full, sub: M.portions > 1 ? "1 von " + M.portions + " Boxen" : "1 Portion frisch" };
}
/* Wahl merken, bevor sich der Standard ändert: abgehakte Tage behalten ihre Mahlzeit */
function freezeMeals(slot) {
  const tk = todayKey();
  for (let d = MEAL_SWITCH; d <= tk; d = addDays(d, 1)) {
    if (S.meal[d] && S.meal[d][slot]) continue;
    if (!(S.mods[d] && Object.keys(S.mods[d]).some(m => S.mods[d][m]))) continue;
    S.meal[d] = S.meal[d] || {}; S.meal[d][slot] = mealFor(d, slot);
  }
}
function pinMeals(k) { ["T1", "T2"].forEach(sl => { S.meal[k] = S.meal[k] || {}; if (!S.meal[k][sl]) S.meal[k][sl] = mealFor(k, sl); }); }
/* Energie-Snack S als Reserve: Decken die Hauptmahlzeiten (plus Abend-Shake) das Stufen-Ziel schon bis auf <175 kcal,
   fällt S aus dem Tagesplan. Abgehakt zählt er trotzdem als gegessen. */
const S_RESERVE_GAP = 175;
function sReserve(k) {
  const p = phaseFor(k);
  if (p.id !== "bulk" || p.mods.indexOf("S") < 0 || k < MEAL_SWITCH) return false;
  const n = nutFor(k);
  const base = p.mods.filter(m => m !== "S").reduce((a, m) => a + modInfo(m, k).kcal, 0) + (n.abend ? shakeK(n.abend) : 0);
  return stufeKcal() - base < S_RESERVE_GAP;
}

"use strict";

const LS_KEY = "sommerbody2027";
let MEM = null;            // In-Memory-Fallback
let storageOK = true;

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { storageOK = false; }
  return null;
}
function defaultState() {
  return { v: 1, w: {}, sleep: {}, steps: {}, waist: {}, mods: {}, wo: {}, setup: {}, pull: [], nsdr: {}, sauna: {}, velo: {}, swim: {}, stufe: 1, exnote: {}, health: {}, extra: {}, goal: "aufbau", meas: {}, hxMeta: {}, strava: { acts: {} }, meal: {}, mealDef: { T1: "quinoa", T2: "pasta" } };
}
let S = loadState() || MEM || defaultState();
// Migration/Absicherung
function migrateState(o) { const d = defaultState(); for (const k in d) if (o[k] === undefined) o[k] = d[k]; if (!o.strava || typeof o.strava !== "object") o.strava = d.strava; if (!o.strava.acts || typeof o.strava.acts !== "object") o.strava.acts = {}; if (!o.meal || typeof o.meal !== "object") o.meal = {}; if (!o.mealDef || typeof o.mealDef !== "object") o.mealDef = d.mealDef; return o; }
migrateState(S);

let saveT = null;
function save() {
  MEM = S;
  if (!storageOK) { updateStorageBadge(); return; }
  clearTimeout(saveT);
  saveT = setTimeout(saveNow, 150);
}
/* Ausstehendes Speichern sofort ausführen (App geht in den Hintergrund, grosser Import ist fertig) */
function saveNow() {
  if (saveT == null) return;
  clearTimeout(saveT); saveT = null;
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch (e) { storageOK = false; updateStorageBadge(); }
}
window.addEventListener("pagehide", saveNow);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveNow(); });
function updateStorageBadge() {
  const b = document.getElementById("storagebadge");
  if (b) b.style.display = storageOK ? "none" : "block";
}

/* ---------- Datum ---------- */
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function dkey(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function fromKey(k) { const p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0); }
function today() { return new Date(); }
function todayKey() { return dkey(today()); }
function addDays(k, n) { const d = fromKey(k); d.setDate(d.getDate() + n); return dkey(d); }
function diffDays(a, b) { return Math.round((fromKey(b) - fromKey(a)) / 86400000); }
const WD = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const WDS = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const MON = ["Jan", "Feb", "März", "Apr", "Mai", "Juni", "Juli", "Aug", "Sep", "Okt", "Nov", "Dez"];
function fmtDate(k) { const d = fromKey(k); return d.getDate() + ". " + MON[d.getMonth()]; }
function fmtDateY(k) { const d = fromKey(k); return d.getDate() + ". " + MON[d.getMonth()] + " " + String(d.getFullYear()).slice(2); }
function mondayOf(k) { const d = fromKey(k); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return dkey(d); }
function isoWeek(k) {
  const d = fromKey(k); const t = new Date(d.valueOf());
  t.setDate(t.getDate() + 3 - ((d.getDay() + 6) % 7));
  const jan4 = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round(((t - jan4) / 86400000 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
}

/* ---------- Phasen ---------- */
function phaseFor(k) {
  for (const p of PLAN.phases) if (k >= p.from && k <= p.to) return p;
  return k < PLAN.phases[0].from ? PLAN.phases[0] : PLAN.phases[PLAN.phases.length - 1];
}
function phaseWeek(k, p) { return Math.floor(diffDays(p.from, k) / 7) + 1; }
function isDeloadWeek(k) { const m = mondayOf(k); return PLAN.deloads.indexOf(m) >= 0; }
function isSetupWeek(k) { return k >= PLAN.setupWeek.from && k <= PLAN.setupWeek.to; }
function trainingWeekNr(k) { const n = Math.floor(diffDays(PLAN.start, k) / 7) + 1; return n > 0 ? n : 0; }
function nextCheckpoint(k) {
  for (const c of PLAN.checkpoints) if (c.date >= k) return c;
  return null;
}
function isTrainDay(k) { return sessKeyFor(k) !== undefined; }
const STUFE_MAX = 4;
function curStufe() { const s = +S.stufe; return s >= 2 && s <= STUFE_MAX ? s : 1; }
/* Ziel im Aufbau-Zeitraum, umschaltbar im Ernährungs-Tab:
   «aufbau» = Masterplan-Tempo (Standard, Entscheid 09.10.2026) · «recomp» = Gewicht halten bis leicht steigend. */
const GOALS = {
  recomp: { label: "Recomp", rate: [0, 0.15],
    note: "Recomp: Gewicht halten bis leicht steigend (0 bis +0.15 kg/Wo) — Fett runter, Muskeln rauf. Langsamer als ein Aufbau, dafür ohne Anessen. Die Energie-Bilanz auf «Heute» zielt auf rund +100 kcal pro Tag.",
    rule: "Recomp-Regel: Fällt der 7-Tage-Ø zwei Wochen in Folge → eine Stufe hoch. Steigt er zwei Wochen lang schneller als +0.3 kg/Wo → eine Stufe zurück. Dazwischen steuert die Energie-Bilanz der Woche auf «Heute»." },
  aufbau: { label: "Aufbau", rate: [0.3, 0.35],
    note: "Aufbau nach Masterplan: +0.3–0.35 kg/Wo Richtung Winter-Peak 97–99 kg. Die Energie-Bilanz auf «Heute» zielt auf rund +350 kcal pro Tag.",
    rule: null }
};
function goalMode() { return S.goal === "recomp" ? "recomp" : "aufbau"; }
function rateFor(p) { return p.id === "bulk" ? GOALS[goalMode()].rate : (p.rate || null); }
function phaseLabel(p) { return p.id === "bulk" && goalMode() === "recomp" ? "Recomp" : p.name; }
function fmtRate(r) {
  const lo = Math.min(r[0], r[1]), hi = Math.max(r[0], r[1]), c = x => String(Math.abs(x)).replace(".", ",");
  if (hi <= 0) return "−" + c(hi) + "–" + c(lo);
  if (lo <= 0) return (lo === 0 ? "0" : "−" + c(lo)) + " bis +" + c(hi);
  return "+" + c(lo) + "–" + c(hi);
}
function nutFor(k) {
  const p = phaseFor(k);
  const base = NUT[p.nut || "bulk"];
  if (p.id !== "bulk") return Object.assign({ milk: 0, abend: null }, base);
  const st = STUFEN[curStufe()];
  const abend = k < MEAL_SWITCH ? STUFEN_ABEND_OLD[curStufe()] : st.abend;
  return Object.assign({}, base, { reis: st.reis, T: st.T, milk: 0, pb: 0, dense: !!st.dense, abend: abend || null, stufe: curStufe() });
}
function phaseKcal(k) {
  const p = phaseFor(k);
  if (p.id === "bulk") return STUFEN[curStufe()].kcal + " kcal pro Tag · Stufe " + curStufe();
  return p.kcal;
}
/* Milch: ohne milkK Milchdrink (0.47 kcal/ml), mit milkK Vollmilch 3.5 % (0.65 kcal/ml) · Erdnussbutter 6 kcal / 0.25 g P pro g */
function shakeK(n) { return Math.round((n.whey || 0) * 4 + n.oats * 3.7 + (n.honey ? n.honey * 3.04 : 0) + (n.milk ? n.milk * (n.milkK || 0.47) : 0) + (n.pb ? n.pb * 6 : 0)); }
function shakeP(n) { return Math.round((n.whey || 0) * 0.8 + n.oats * 0.13 + (n.milk ? n.milk * 0.034 : 0) + (n.pb ? n.pb * 0.25 : 0)); }
function milkTxt(n) { return n.milk ? n.milk + " ml " + (n.milkK ? "Vollmilch" : "Milch") : ""; }
function shakeTxt(n) { return [n.whey ? n.whey + " g Whey" : "", n.oats + " g Oats", n.honey ? n.honey + " g Honig" : "", n.milk ? milkTxt(n) : "", n.pb ? n.pb + " g Erdnussbutter" : ""].filter(Boolean).join(" + "); }

  const v4 = mon >= V4_WEEK;   // ab Training v4 ist die Pump-Session fixer Teil des Wochen-Solls

  const bonus = v4 ? 0 : days.filter(d => S.wo[d] && S.wo[d].done && S.wo[d].sess === "px").length;
  const planned = days.filter(d => isTrainDay(d) && d <= todayKey());
  const target = days.filter(isTrainDay).length + (v4 && mon >= PLAN_SWITCH ? 1 : 0);
  let modHit = 0, modTot = 0;
  days.forEach(d => {
    if (d > todayKey()) return;

    const got = S.mods[d] || {};
    need.forEach(m => { if (got[m]) modHit++; });

  const sleepH = days.map(d => S.sleep[d] && S.sleep[d].h).filter(v => v != null);
  const sleepQ = days.map(d => S.sleep[d] && S.sleep[d].q).filter(v => v != null);
  const steps = days.map(d => S.steps[d]).filter(v => v != null);
  const wts = days.map(d => S.w[d]).filter(v => v != null);
  const prevWts = []; for (let i = 1; i <= 7; i++) { const v = S.w[addDays(mon, -i)]; if (v != null) prevWts.push(v); }

  const swim = days.filter(d => S.swim[d]).length;
  return {
    mon, days, trainDone: done.length, trainPlanned: planned.length, trainTarget: target, bonus,
    modPct: modTot ? Math.round(100 * modHit / modTot) : null, modHit, modTot,
    sleepH: avg(sleepH), sleepQ: avg(sleepQ), steps: avg(steps),
    wAvg: wts.length ? avg(wts) : null, wPrev: prevWts.length ? avg(prevWts) : null,
    wDays: wts.length, nsdr, sauna, velo, veloLong, swim

}

/* «Holen» merkt sich den Zeitpunkt; kommt die App innert 15 Min zurück in den Vordergrund, öffnet sich das Übernehmen-Sheet */
function hpSet() { APP.hp = Date.now(); try { localStorage.setItem(HP_KEY, String(APP.hp)); } catch (e) { /* egal */ } }
function hpTake() {
  let t = APP.hp || 0;
  try { t = Math.max(t, +localStorage.getItem(HP_KEY) || 0); localStorage.removeItem(HP_KEY); } catch (e) { /* egal */ }
  APP.hp = 0;

}

/* Erholung-Tab: Watch-Kacheln, nur wenn in den letzten 7 Tagen Health-Daten kamen */
function healthRecBlock(k) {
  let any = false;
  for (let i = 0; i < 7; i++) if (S.health[addDays(k, -i)]) any = true;
  if (!any) return "";
  const lastOf = f => { for (let i = 0; i < 7; i++) { const d = addDays(k, -i), h = S.health[d]; if (h && h[f] != null) return { v: h[f], d: d }; } return null; };
  const r = lastOf("rhr"), v = lastOf("hrv"), aR = hAvg(k, "rhr", 7, true), aH = hAvg(k, "hrv", 7, true), st = recState(k);
  const sl7 = []; for (let i = 0; i < 7; i++) { const s = S.sleep[addDays(k, -i)]; if (s && s.h != null) sl7.push(s.h); }
  const slT = S.sleep[k] && S.sleep[k].h != null ? S.sleep[k].h : null;
  const when = x => x.d === k ? "heute" : fmtDate(x.d), U = '<span style="color:var(--muted);font-size:15px">';

      <div class="stat"><div class="lbl">HRV</div><div class="val">${v ? v.v : "—"}${U} ms</span></div><div class="sub">${v ? when(v) : "keine Daten"}${aH && aH.n > 1 ? " · Ø 7 T. " + Math.round(aH.v) : ""}</div></div>
      <div class="stat"><div class="lbl">Schlaf letzte Nacht</div><div class="val">${slT != null ? hmTxt(slT) : "—"}</div><div class="sub">Ziel 7 h 45 – 8 h 30</div></div>
      <div class="stat"><div class="lbl">Schlaf Ø 7 Tage</div><div class="val">${sl7.length ? hmTxt(avg(sl7)) : "—"}</div><div class="sub">${sl7.length} ${sl7.length === 1 ? "Nacht" : "Nächte"} erfasst</div></div>

/* ============ APPLE HEALTH · ALLE WERTE ============ */
const H_CUM = { steps: 1, act: 1, rest: 1, exMin: 1, standH: 1, dist: 1, flights: 1, daylight: 1, mindful: 1, water: 1 };   // Tagessummen: heute ist ein Zwischenstand
const H_BASE = { steps: ["Schritte", v => fmtK(v)], act: ["Aktivkalorien", v => fmtK(v) + " kcal"], rest: ["Ruhekalorien", v => fmtK(v) + " kcal"],
  rhr: ["Ruhepuls", v => Math.round(v) + " /min"], hrv: ["HRV", v => Math.round(v) + " ms"], sleep: ["Schlaf", v => hmTxt(v)] };
const H_GROUPS = [["Aktivität", ["steps", "act", "rest", "exMin", "standH", "dist", "flights", "daylight", "mindful", "water"]],
  ["Herz und Fitness", ["rhr", "hrv", "whr", "hrr", "vo2"]],
  ["Schlaf und Erholung", ["sleep", "slDeep", "slRem", "slCore", "slAwake", "inBed", "resp", "spo2", "wtemp"]]];
function hLabel(f) { return H_BASE[f] ? H_BASE[f][0] : HXF[f].l; }
function hTxt(f, v) { return H_BASE[f] ? H_BASE[f][1](v) : hxFmt(HXF[f], hxRound(HXF[f], v)); }
function hVal(k, f) {
  if (f === "sleep") return S.sleep[k] && S.sleep[k].h != null ? S.sleep[k].h : null;
  if (f === "steps") return S.steps[k] != null ? S.steps[k] : null;
  const h = S.health[k];
  if (!h) return null;
  if (f === "rest" && h.actAt && k < todayKey()) return null;   // Abendstand eines vergangenen Tages ist kein Tageswert
  if (f === "wtemp" && h.wtemp == null) return h.wtD != null ? h.wtD : null;
  return h[f] != null ? h[f] : null;
}
/* Letzter Wert (bis 28 Tage zurück) und Schnitte über 7 und 28 Tage; Tagessummen ohne den laufenden Tag */
function hSeries(k, f) {
  let last = null; const a7 = [], a28 = [];
  for (let i = 0; i < 28; i++) {
    const d = addDays(k, -i), v = hVal(d, f);
    if (v == null) continue;
    if (!last) last = { v: v, d: d };
    if (H_CUM[f] && i === 0) continue;
    if (i < (H_CUM[f] ? 8 : 7)) a7.push(v);
    a28.push(v);
  }
  return { last: last, a7: a7.length ? avg(a7) : null, a28: a28.length ? avg(a28) : null, n: a28.length };
}
/* Zeile im Sheet: Name links, Wert + Datum rechts, darunter klein die Schnitte bzw. Details */
function hRow(label, val, when, subs) {
  const M = "color:var(--muted);font-weight:500;font-size:12.5px";
  return `<div class="kv" style="display:block"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><span class="k">${esc(label)}</span><span class="v" style="white-space:nowrap;flex:none"><span style="font-variant-numeric:tabular-nums">${esc(val)}</span>${when ? ` <span style="${M}">${esc(when)}</span>` : ""}</span></div>${subs && subs.length ? `<div style="${M};margin-top:3px;text-align:right">${subs.map(x => `<span style="white-space:nowrap">${esc(x)}</span>`).join(" · ")}</div>` : ""}</div>`;
}
/* Namen der weiteren Messwerte der letzten n Tage, alphabetisch */
function hxgLabels(k, n) {
  const set = {};
  for (let i = 0; i < n; i++) { const h = S.health[addDays(k, -i)]; if (h && h.x) Object.keys(h.x).forEach(lb => { set[lb] = 1; }); }
  return Object.keys(set).sort((a, b) => a.localeCompare(b, "de"));
}
function healthAllSheet() {
  const k = todayKey(), none = [];
  const row = f => {
    const s = hSeries(k, f);
    if (!s.last) { none.push(hLabel(f)); return ""; }
    let val = hTxt(f, s.last.v), subs = [s.a7 != null && s.n > 1 ? "Ø 7 Tage " + hTxt(f, s.a7) : "", s.a28 != null && s.n > 7 ? "Ø 28 Tage " + hTxt(f, s.a28) : ""].filter(Boolean);
    if (f === "wtemp") { const dv = wtDev(s.last.d); if (dv != null) { val = sgn1(dv) + " °C"; subs = ["zum eigenen 7-Nächte-Schnitt"]; } else subs = ["Abweichung ab 5 Nächten"]; }
    return hRow(hLabel(f), val, s.last.d === k ? (H_CUM[f] ? "heute bisher" : "heute") : fmtDate(s.last.d), subs);
  };
  const groups = H_GROUPS.map(g => { const rows = g[1].map(row).join(""); return rows ? `<h2 class="sec" style="margin-top:14px">${g[0]}</h2><div class="card" style="padding:4px 16px">${rows}</div>` : ""; }).join("");
  const xl = hxgLabels(k, 28), xrows = xl.map(lb => {
    let last = null; const a7 = [], a28 = [];
    for (let i = 0; i < 28; i++) { const d = addDays(k, -i), h = S.health[d], v = h && h.x ? h.x[lb] : null; if (v == null) continue; if (!last) last = { v: v, d: d }; if (i < 7) a7.push(v); a28.push(v); }
    return hRow(lb, hxgTxt(lb, last.v), last.d === k ? "heute" : fmtDate(last.d), [a28.length > 1 && a7.length ? "Ø 7 Tage " + hxgTxt(lb, avg(a7)) : "", a28.length > 7 ? "Ø 28 Tage " + hxgTxt(lb, avg(a28)) : ""].filter(Boolean));
  }).join("");
  const wk = [];
  for (let i = 0; i < 14; i++) { const d = addDays(k, -i); dayTrainings(d).forEach(x => { const p = trParts(x); wk.push(hRow(WDS[fromKey(d).getDay()] + " " + fmtDate(d), p[0], "", p.slice(1).concat(svOn() || x.src === "s" ? [trSrc(x)] : []))); }); }
  const svr = svRows(k);
  openSheet(`
    <div class="sheettitle">Apple Health · alle Werte</div>
    <div style="color:var(--muted);font-size:14px;margin-bottom:4px">Letzter Wert und Schnitte. Was die Watch nicht misst oder der Import nicht liefert, fehlt.</div>
    ${groups || xrows ? groups : `<div class="emptyhint">Noch keine Health-Daten. Kurzbefehl ausführen oder den Gesamt-Export einlesen.</div>`}
    ${xrows ? `<h2 class="sec" style="margin-top:14px">Weitere Messwerte · ${xl.length}</h2><div class="card" style="padding:4px 16px">${xrows}</div>` : ""}
    ${svr ? `<h2 class="sec" style="margin-top:14px">Strava</h2><div class="card" style="padding:4px 16px">${svr}</div>` : ""}
    ${wk.length ? `<h2 class="sec" style="margin-top:14px">Trainings · letzte 14 Tage</h2><div class="card" style="padding:4px 16px">${wk.join("")}</div>` : ""}
    ${none.length ? `<div class="note">Noch keine Daten: ${esc(none.join(" · "))}. Kommen mit dem Gesamt-Export oder einer Zeile im Kurzbefehl, falls deine Watch sie misst.</div>` : ""}
    <div class="note">Von Hand: Gewicht im Morgen-Check, Umfänge unter Fortschritt.${svOn() ? "" : " Velotouren aus Strava: Heute → Ausdauer → Verbinden."}</div>
    <div class="timerrow"><button class="btn ghost" id="haexport">Export</button><button class="btn" id="haclose">Schliessen</button></div>`);
  document.getElementById("haclose").addEventListener("click", closeSheet);
  document.getElementById("haexport").addEventListener("click", healthExportSheet);
}
/* Erholung-Tab: Zusatz-Kacheln, je nur wenn Daten da sind */
function healthRecExtra(k) {
  const lastOf = f => { for (let i = 0; i < 7; i++) { const d = addDays(k, -i), v = hVal(d, f); if (v != null) return { v: v, d: d }; } return null; };
  const when = x => x.d === k ? "heute" : fmtDate(x.d), U = '<span style="color:var(--muted);font-size:15px">';
  const tile = (lbl, val, sub) => `<div class="stat"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
  let o = "";
  const dp = lastOf("slDeep"), rm = lastOf("slRem");
  if (dp || rm) { const x = dp || rm, h = S.health[x.d] || {}; o += tile("Tiefschlaf", h.slDeep != null ? hmTxt(h.slDeep) : "—", [when(x), h.slRem != null ? "REM " + hmTxt(h.slRem) : "", h.slAwake != null ? "wach " + hmTxt(h.slAwake) : ""].filter(Boolean).join(" · ")); }
  const rs = lastOf("resp"); if (rs) { const a = hAvg(k, "resp", 7, true); o += tile("Atemfrequenz", hxNumTxt(rs.v, 1) + U + " /min</span>", when(rs) + (a && a.n > 1 ? " · Ø 7 T. " + hxNumTxt(a.v, 1) : "")); }
  const wt = lastOf("wtemp"); if (wt) { const dv = wtDev(wt.d); o += tile("Handgelenk-Temp.", dv != null ? sgn1(dv) + U + " °C</span>" : hxNumTxt(wt.v, 1) + U + " °C</span>", when(wt) + (dv != null ? " · zum eigenen Schnitt" : " · Schnitt ab 5 Nächten")); }
  const ox = lastOf("spo2"); if (ox) { const a = hAvg(k, "spo2", 7, true); o += tile("Blutsauerstoff", Math.round(ox.v) + U + " %</span>", when(ox) + (a && a.n > 1 ? " · Ø 7 T. " + Math.round(a.v) : "")); }
  const vo = hSeries(k, "vo2"); if (vo.last) o += tile("VO₂max", hxNumTxt(vo.last.v, 1), (vo.last.d === k ? "heute" : fmtDate(vo.last.d)) + (vo.n > 1 ? " · Ø 28 T. " + hxNumTxt(vo.a28, 1) : ""));
  return o;
}

/* ============ APPLE HEALTH · GESAMT-EXPORT (Export.zip oder XML direkt in der App lesen) ============ */
/* Health-App → Profil → «Alle Gesundheitsdaten exportieren». Die ZIP enthält eine XML mit einer Zeile pro Messwert.
   Gelesen wird im Stream (die Datei kann über 1 GB gross sein), behalten werden nur Tageswerte ab HX_FROM. Nichts verlässt das Gerät. */
const HX_SUM = { StepCount: "steps", DistanceWalkingRunning: "dist", FlightsClimbed: "flights", ActiveEnergyBurned: "act", BasalEnergyBurned: "rest",
  AppleExerciseTime: "exMin", DistanceCycling: "veloKm", DistanceSwimming: "swimM", TimeInDaylight: "daylight", DietaryWater: "water" };
const HX_AVG = { RestingHeartRate: "rhr", HeartRateVariabilitySDNN: "hrv", WalkingHeartRateAverage: "whr", VO2Max: "vo2", HeartRateRecoveryOneMinute: "hrr",
  RespiratoryRate: "resp", OxygenSaturation: "spo2", AppleSleepingWristTemperature: "wtemp", BodyMass: "w", WaistCircumference: "waist" };
const HX_LAST = { w: 1, waist: 1, vo2: 1, hrr: 1 };          // letzter Wert des Tages statt Schnitt
const HX_INT = { steps: 1, act: 1, rest: 1, flights: 1, standH: 1 };
const HX_NIGHT = { resp: 1, spo2: 1, wtemp: 1 };             // Nachtwerte zählen zum Aufwach-Tag
const HX_SLEEP = { AsleepCore: "slCore", AsleepDeep: "slDeep", AsleepREM: "slRem", AsleepUnspecified: "slU", Asleep: "slU", Awake: "slAwake", InBed: "inBed" };

function dayTrainings(k) {

  const sv = svDay(k).map(a => ({ src: "s", name: svName(a), nm: a.nm && !svPlainName(a.nm) ? a.nm : "", min: a.min, tot: a.tot, kcal: a.kcal, km: a.km, hm: a.hm, hr: a.hr, t: a.t, cat: svCat(svName(a) + " " + a.st) }));

    const near = s => x.t && s.t ? Math.abs(hm(x.t) - hm(s.t)) <= 15 : [s.min, s.tot].some(m => m != null && Math.abs((x.min || 0) - m) <= Math.max(10, 0.2 * m));

/* Token holen oder erneuern. Strava gibt beim Erneuern teils einen neuen Refresh-Token, der alte gilt dann nicht mehr. */
async function svToken(params) {

  catch (e) { throw new Error("net"); }
  let j = null; try { j = await r.json(); } catch (e) { j = null; }
  if (r.status === 429) throw new Error("limit");

async function svAccess(force) {

async function svGet(path, retry) {
  const tok = await svAccess(retry);

  if (r.status === 401 && !retry) return svGet(path, true);

function svEpoch(k) { const p = k.split("-"); return Math.floor(new Date(+p[0], +p[1] - 1, +p[2], 0, 0, 0).getTime() / 1000); }
/* Abgleich: Aktivitäten seit Plan-Start (erstes Mal oder full) bzw. der letzten 3 Wochen holen. In Strava Gelöschtes verschwindet,

function svSync(full) {
  if (APP.svBusy) return APP.svBusy;

    const tk = todayKey(), first = !S.strava.ts, from = full || first ? hxFromDay() : (addDays(tk, -21) > hxFromDay() ? addDays(tk, -21) : hxFromDay());
    const got = [];
    for (let page = 1; page <= 10; page++) {
      const a = await svGet("/athlete/activities?after=" + svEpoch(addDays(from, -1)) + "&per_page=100&page=" + page);
      if (!Array.isArray(a)) throw new Error("net");
      a.forEach(x => got.push(x));

    }

    let added = 0, removed = 0, n = 0;
    got.forEach(x => {
      const o = svMap(x); if (!o || o.d < from || o.d > tk) return;
      n++;
      const p = hxOwn(old, o.id);
      if (p) { if (p.kcal != null) o.kcal = p.kcal; if (p.kcT) o.kcT = p.kcT; if (p.km !== o.km || p.min !== o.min || p.st !== o.st || p.d !== o.d) changed[o.d] = 1; }

/* Velo- und Schwimm-Modul für die Tage mit neuen oder geänderten Aktivitäten: nur hochstufen, nie löschen */
function svApplyDays(days) {

    svDay(k).forEach(a => { if (hxOwn(SV_VELO, a.st) && !SV_EBIKE[a.st]) { km += a.km || 0; min += a.min || 0; } if (a.st === "Swim") { sm += (a.km || 0) * 1000; smin += a.min || 0; } });

/* Beim Öffnen und beim Zurückkehren in die App: höchstens alle 20 Minuten still abgleichen */

/* Rückkehr von Strava: ?state=…&code=…&scope=… bzw. ?error=access_denied */
function svCallback() {
  const q = new URLSearchParams(location.search);
  if (!q.has("state") || !(q.has("code") || q.has("error"))) return false;
  try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) { /* egal */ }
  const c = svCfg(), code = (q.get("code") || "").replace(/[^0-9a-zA-Z]/g, "").slice(0, 80), scope = q.get("scope") || "";
  const mine = c.state && c.state === q.get("state") && Date.now() - (c.stateAt || 0) < 3600000;
  delete c.state; delete c.stateAt; svSet(c);
  if (q.get("error")) { svSheet("Bei Strava wurde der Zugriff abgelehnt. Ohne Erlaubnis kann die App keine Aktivitäten lesen."); return true; }
  if (!mine || !c.id || !c.secret) { svCodeSheet(code); return true; }
  if (!/activity:read/.test(scope)) { svSheet("Bei Strava fehlte das Häkchen bei den Aktivitäten. Nochmals verbinden und es stehen lassen."); return true; }

async function svConnect(code) {

  svSheet(null, "Verbinde mit Strava …");

    await svToken({ code: code, grant_type: "authorization_code" });
    S.strava.err = ""; S.strava.ts = 0;

/* «Alle Werte»: Strava-Zusammenfassung der letzten 28 Tage */
function svRows(k) {
  const A = svActs(), acts = Object.keys(A).map(id => A[id]).filter(a => a.d <= k && a.d > addDays(k, -28));
  if (!acts.length) return "";
  const sum = (l, f) => l.reduce((s, a) => s + (a[f] || 0), 0), kmTxt = v => fmt1(v).replace(/,0$/, "") + " km";
  const velo = n => acts.filter(a => hxOwn(SV_VELO, a.st) && a.d > addDays(k, -n));
  const vrow = n => { const l = velo(n); return l.length ? hRow("Velo · " + n + " Tage", kmTxt(sum(l, "km")), "", [l.length + (l.length === 1 ? " Fahrt" : " Fahrten"), durTxt(sum(l, "min")), sum(l, "hm") ? fmtK(sum(l, "hm")) + " Hm" : ""].filter(Boolean)) : ""; };

  const other = {}; acts.filter(a => !hxOwn(SV_VELO, a.st)).forEach(a => { const n = svName(a); (other[n] = other[n] || []).push(a); });
  return vrow(7) + vrow(28)
    + (lg && lg.km ? hRow("Längste Fahrt", kmTxt(lg.km), fmtDate(lg.d), [durTxt(lg.min), lg.hm ? fmtK(lg.hm) + " Hm" : "", lg.nm && !svPlainName(lg.nm) ? "«" + lg.nm + "»" : ""].filter(Boolean)) : "")
    + Object.keys(other).sort((a, b) => a.localeCompare(b, "de")).map(n => { const l = other[n]; return hRow(n + " · 28 Tage", l.length + "×", "", [durTxt(sum(l, "min")), sum(l, "km") ? kmTxt(sum(l, "km")) : ""].filter(Boolean)); }).join("");
}

/* ============ ENERGIE-BILANZ (Watch-Kalorien gegen Gegessenes) ============ */
/* Verbrauch = Ruheenergie + Aktivenergie (Apple Watch) + Verdauung (~10 % des Gegessenen, die Watch misst sie nicht)

    if ((m === "T1" || m === "T2") && S.mods[k][m]) { S.meal[k] = S.meal[k] || {}; if (!S.meal[k][m]) S.meal[k][m] = mealFor(k, m); }
    save(); vHome();
  }));
  root.querySelectorAll("[data-meal]").forEach(b => b.addEventListener("click", () => mealSheet(b.dataset.meal, k)));
  root.querySelectorAll("[data-open-sess]").forEach(x => x.addEventListener("click", () => { APP.session = x.dataset.openSess; APP.tab = "train"; renderAll(); window.scrollTo(0, 0); }));
  root.querySelectorAll("[data-timer]").forEach(b => b.addEventListener("click", () => openTimer(b.dataset.timer)));
  bindHealth(root);
  bindEnergy(root);
  root.querySelectorAll("[data-velo]").forEach(b => b.addEventListener("click", () => {
    const v = b.dataset.velo;
    if (v) S.velo[k] = v; else { delete S.velo[k]; if (S.mods[k]) delete S.mods[k].V; }
    save(); vHome();
  }));
  root.querySelectorAll("[data-swim]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.swim === "1") S.swim[k] = 1; else { delete S.swim[k]; if (S.mods[k]) delete S.mods[k].W; }
    save(); vHome();
  }));
  root.querySelectorAll("[data-strava]").forEach(b => b.addEventListener("click", () => svSheet()));
}

/* ============ TRAINING: Wochenplan ============ */
function vTrain() {
  const k = todayKey(); const root = document.getElementById("scr-train");
  const wd = today().getDay();
  const order = [1, 2, 3, 4, 5, 6, 0];
  const mon = mondayOf(k);
  const rows = order.map((w, i) => {
    const dayKey = addDays(mon, i);
    const sk = sessKeyFor(dayKey);
    if (!sk) {
      const r = restdayFor(dayKey)[w] || { title: "frei" };
      const px = S.wo[dayKey] && S.wo[dayKey].sess === "px" && S.wo[dayKey].done;
      const pxOpen = px && dayKey === k;   // nur heute öffnen: die Session-Ansicht schreibt immer in den heutigen Tag
      return `<div class="sessrow ${w === wd ? "today" : ""}"${pxOpen ? ' data-open-sess="px"' : ""}><div class="day">${WDS[w]}</div>
        <div class="grow"><div class="nm" style="color:var(--muted);font-weight:500">${esc(r.title)}</div>${px ? `<div class="meta">+ ${esc(SESSIONS.px.name)} ✓</div>` : ""}</div>${pxOpen ? `<div class="chev">›</div>` : ""}</div>`;
    }
    const sess = SESSIONS[sk];
    const done = S.wo[dayKey] && S.wo[dayKey].done;
    return `<div class="sessrow ${w === wd ? "today" : ""}" data-open-sess="${sk}">
      <div class="day">${WDS[w]}</div>
      <div class="grow"><div class="nm">${esc(sess.name)}</div><div class="meta">${sess.time ? sess.time + " · " : ""}${sess.dur} · ${sess.slots.length} Übungen</div></div>
      <div class="st ${done ? "ok" : ""}">${done ? "✓" : ""}</div><div class="chev">›</div></div>`;
  }).join("");
  // Wechselwoche: die neuen Sessions schon zum Ansehen
  const preview = mon < PLAN_SWITCH && addDays(mon, 6) >= PLAN_SWITCH ? `
    <h2 class="sec">Neuer Split · ab ${WDS[fromKey(PLAN_FIRST).getDay()]} ${fmtDate(PLAN_FIRST)}</h2>
    <div class="card pad0">${[2, 3, 4, 5].map(d => { const ns = SESSIONS[WEEKPLAN[d]]; return `<div class="sessrow" data-open-sess="${ns.key}">
      <div class="day">${WDS[d]}</div>
      <div class="grow"><div class="nm">${esc(ns.name)}</div><div class="meta">${ns.time} · ${ns.dur} · ${ns.slots.length} Übungen</div></div>
      <div class="st"></div><div class="chev">›</div></div>`; }).join("")}</div>` : "";

  // Optionale 5. Einheit: startbar an Sa/So, einmal pro Woche
  const pxS = SESSIONS.px, pxOther = pxDoneWeek(k), pxOk = pxAllowed(k) && !pxOther, pxToday = S.wo[k] && S.wo[k].sess === "px";
  const pxMeta = pxS.dur + " · " + pxS.slots.map(s => EXERCISES[s.ex].name).join(" · ");
  const pxNote = pxToday && S.wo[k].done ? "Heute absolviert." : pxOther ? "Diese Woche schon gemacht (" + WDS[fromKey(pxOther).getDay()] + " " + fmtDate(pxOther) + ")." : pxOk ? "Heute startbar." : "Startbar am Sa oder So.";
  const pxCard = k >= PLAN_SWITCH ? `
    <h2 class="sec">5. Einheit · Sa oder So</h2>
    <div class="card pad0"><div class="sessrow"${pxOk || pxToday ? ' data-open-sess="px"' : ""}>
      <div class="day">+1</div>
      <div class="grow"><div class="nm"${pxOk || pxToday ? "" : ' style="color:var(--muted)"'}>${esc(pxS.name)}</div><div class="meta">${esc(pxMeta)}</div><div class="meta">${esc(pxNote)}</div></div>
      ${pxOk || pxToday ? `<div class="st ${pxToday && S.wo[k].done ? "ok" : ""}">${pxToday && S.wo[k].done ? "✓" : ""}</div><div class="chev">›</div>` : ""}</div></div>
    <div class="note" style="padding:0 4px">Der dritte Reiz der Woche für Brust, Schultern und Arme. Zählt ins Wochen-Soll (5).</div>` : "";

  const pullLog = S.pull.slice(-3).reverse().map(t => `<div class="kv"><span class="k">${fmtDateY(t.d)}</span><span class="v">${esc(t.res)}</span></div>`).join("");

  root.innerHTML = `
    <div class="ltitle">Training</div>
    <div class="lsub">${k < PLAN_SWITCH ? "5 Tage · KH, Maschinen & Kabel · verletzungsfrei zuerst" : "v4 · Oberkörper-Fokus · Di–Fr 07:15 + Pump-Session Sa oder So"}</div>
    ${bannersFor(k)}
    <div class="card pad0">${rows}</div>${preview}${pxCard}

    <h2 class="sec">Klimmzug-Projekt</h2>
    <div class="card">
      <div class="row"><span style="font-size:20px">🧗</span><div class="grow"><b>${esc(PULLUP_PROJECT.goal)}</b></div></div>
      <ul style="margin:8px 0 0 18px;color:var(--ink2);font-size:14px">${PULLUP_PROJECT.lines.map(l => `<li style="margin-bottom:3px">${esc(l)}</li>`).join("")}</ul>
      ${pullLog ? `<div class="divider"></div>${pullLog}` : ""}
      <button class="btn ghost" id="pulladd">Monats-Test eintragen</button>
    </div>

    <h2 class="sec">Regeln</h2>
    ${TRAINING_RULES.map((r, i) => `<div class="card" style="padding:0"><button class="row" data-rule="${i}" style="width:100%;padding:13px 16px;text-align:left">
      <div class="grow" style="font-weight:650;font-size:15px">${esc(r[0])}</div><div class="chev" id="rc-${i}">›</div></button>
      <div class="exdetail" id="rd-${i}" style="border-top:none;padding-top:0">${esc(r[1])}</div></div>`).join("")}`;

  root.querySelectorAll("[data-open-sess]").forEach(x => x.addEventListener("click", () => { APP.session = x.dataset.openSess; renderAll(); window.scrollTo(0, 0); }));
  root.querySelectorAll("[data-rule]").forEach(b => b.addEventListener("click", () => {
    const d = document.getElementById("rd-" + b.dataset.rule);
    d.classList.toggle("open");
    document.getElementById("rc-" + b.dataset.rule).style.transform = d.classList.contains("open") ? "rotate(90deg)" : "";
  }));
  document.getElementById("pulladd").addEventListener("click", () => openPullTest());
}

/* ============ TRAINING: Session-Detail ============ */
function parseStartW(s) {
  if (!s) return null;
  const m = s.match(/2×(\d+(?:\.\d+)?)\s*kg/); if (m) return parseFloat(m[1]);
  const m2 = s.match(/^(\d+(?:\.\d+)?)\s*kg/); if (m2) return parseFloat(m2[1]);
  return null;
}
function repTop(reps) { const m = String(reps).match(/(\d+)\s*$/); return m ? parseInt(m[1]) : null; }

function vSession() {
  const sess = SESSIONS[APP.session];
  const k = todayKey(); const root = document.getElementById("scr-train");
  // Pump-Session nur an einem freien Sa/So — sonst würde sie das heutige Training im Log überschreiben
  if (APP.session === "px" && !(S.wo[k] && S.wo[k].sess === "px") && !(pxAllowed(k) && !pxDoneWeek(k))) { APP.session = null; vTrain(); return; }
  S.wo[k] = S.wo[k] || { sess: APP.session, ex: {} };
  if (!S.wo[k].ex) S.wo[k].ex = {};
  const wo = S.wo[k];
  const deload = isDeloadWeek(k), setup = isSetupWeek(k);

  const slotHtml = sess.slots.map((slot, si) => {
    const ex = EXERCISES[slot.ex];
    const perf = lastPerf(slot.ex, k);
    const log = wo.ex[slot.ex] || { sets: [] };
    const nSets = Math.max(slot.sets, log.sets.length);
    let progHint = "";
    if (perf) {
      const top = repTop(slot.reps);
      if (top && perf.sets.length >= slot.sets && perf.sets.every(s => s[1] >= top))
        progHint = `<div style="color:var(--good);font-size:13px;font-weight:650;margin-top:3px">↗︎ Oberes Ziel erreicht — heute kleinste Steigerung!</div>`;
    }
    const setRows = Array.from({ length: nSets }, (_, i) => {
      const st = log.sets[i] || [];
      const prevSet = perf && perf.sets[i];
      return `<div class="setrow">
        <div class="snr">${i + 1}</div>
        <input type="number" inputmode="decimal" step="0.5" placeholder="${prevSet ? prevSet[0] : (parseStartW(slot.start) || "kg")}" value="${st[0] != null ? st[0] : ""}" data-set="${slot.ex}|${i}|0">
        <span class="x">kg ×</span>
        <input type="number" inputmode="numeric" step="1" placeholder="${prevSet ? prevSet[1] : slot.reps}" value="${st[1] != null ? st[1] : ""}" data-set="${slot.ex}|${i}|1">
        <button class="setok ${st[2] ? "on" : ""}" data-setok="${slot.ex}|${i}">✓</button>
      </div>`;
    }).join("");
    return `<div class="excard">
      <div class="exhead">
        <div class="nr">SLOT ${si + 1}${slot.pair ? " · Wechselsatz mit Slot " + slot.pair : ""}${slot.ss ? " · Superset mit Slot " + slot.ss : ""}</div>
        <div class="nm">${esc(ex.name)}</div>
        <div class="target">${slot.sets} × ${slot.reps}${deload ? " · Deload: ½ Sätze, −10 %" : setup ? " · RIR 3, Gewicht finden" : " · RIR 1–2"}</div>
        ${ex.cue ? `<div class="cue">★ ${esc(ex.cue)}</div>` : ""}
        ${perf ? `<div class="last">Letztes Mal (${fmtDate(perf.date)}): ${fmtSets(perf.sets)}</div>` : `<div class="startw">Start: ${esc(slot.start)}</div>`}
        ${progHint}
        ${slot.note ? `<div class="startw">${esc(slot.note)}</div>` : ""}
      </div>
      ${setRows}
      <div class="exfoot">
        ${slot.pair ? `<button class="minibtn" data-timer="pause75">⏱ 75 s</button>
        <button class="minibtn" data-timer="pause90">90 s</button>
        <button class="minibtn" data-timer="pause120">2 Min</button>` : `<button class="minibtn" data-timer="pause90">⏱ 90 s</button>
        <button class="minibtn" data-timer="pause120">2 Min</button>
        <button class="minibtn" data-timer="pause180">3 Min</button>`}
        <button class="minibtn" data-addset="${slot.ex}">+ Satz</button>
        <button class="minibtn blue" data-tech="${slot.ex}">📖 Technik & Setup</button>
      </div>
      <div class="exdetail" id="tech-${slot.ex}">
        <h4>Maschinen-Setup / Notiz (bleibt gespeichert)</h4>
        <textarea class="setupnote" data-setup="${slot.ex}" placeholder="z.B. Stadelhofen, Sitz 7, Griff 3 …">${esc(S.setup[slot.ex] || "")}</textarea>
        <h4>Setup</h4>${esc(ex.setup)}
        ${ex.tall ? `<h4>Für deine 2 m</h4><div class="tallrow">📏 ${esc(ex.tall)}</div>` : ""}
        ${ex.shoulder ? `<h4>Schulter-Schutz</h4><div class="shldrow">🛡️ ${esc(ex.shoulder)}</div>` : ""}
        <h4>Ausführung — Schritt für Schritt</h4>${Array.isArray(ex.exec) ? `<ol class="steps">${ex.exec.map(s => `<li>${esc(s)}</li>`).join("")}</ol>` : esc(ex.exec)}
        <h4>Spüren</h4><span class="ok">✓ ${esc(ex.feel)}</span><br><span class="no">✗ ${esc(ex.notFeel)}</span>
        <h4>Häufigste Fehler</h4>${esc(ex.mistakes)}
        <h4>Selbstcheck</h4>${esc(ex.check)}
        ${slot.alts && slot.alts.length ? `<h4>Alternativen (gleicher Slot)</h4>${slot.alts.map(esc).join(" · ")}` : ""}
        <h4>Video</h4>${ex.videos.map(v => `<a href="${v[1]}" target="_blank" rel="noopener">▶︎ ${esc(v[0])}</a>`).join(" · ")}
      </div>
    </div>`;
  }).join("");

  root.innerHTML = `
    <div class="subhead">
      <button class="backbtn" id="back">‹</button>
      <div class="grow"><div class="t">${sess.day} — ${esc(sess.name)}</div><div class="s">${sess.time ? sess.time + " · " : ""}${sess.dur} · ${esc(sess.pauses || "Pausen: Verbund 2–3 Min, Isolation 60–90 s")}</div></div>
    </div>
    ${bannersFor(k)}
    ${todayKey() <= "2026-11-09" ? `<div class="banner blue"><span class="ic">📖</span><div><b>Neu: Übungs-Guides für deine 2 m.</b> Bei jeder Übung «Technik & Setup» öffnen — Schritt-für-Schritt-Ausführung, 2-m-Hinweise, Schulter-Schutz. Und: Gewicht + Wdh nach jedem Satz eintragen, ohne Log keine Progression.</div></div>` : ""}
    <div class="card" style="background:var(--surface2)">
      <div style="font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px">Warm-up · 8 Min</div>
      <div style="font-size:14px;color:var(--ink2);margin-top:3px">${esc(sess.warmup)}</div>
      ${sess.after ? `<div style="font-size:13.5px;color:var(--aqua);margin-top:6px">${sess.afterIcon || "♨️"} ${esc(sess.after)}</div>` : ""}
    </div>
    ${slotHtml}
    <button class="btn ${wo.done ? "done" : ""}" id="finishbtn">${wo.done ? "✓ Session absolviert — stark!" : "Session abschliessen"}</button>
    <div class="note" style="text-align:center;margin-bottom:10px">${sess.time ? "Um 08:15 ist Schluss. Zeit knapp? Die Hauptblöcke à 2 Sätze zählen als voller Trainingstag." : "Zeit knapp? Slots 1–3 à 2 Sätze zählen als voller Trainingstag."}</div>`;

  document.getElementById("back").addEventListener("click", () => { APP.session = null; renderAll(); });
  root.querySelectorAll("[data-set]").forEach(inp => inp.addEventListener("change", () => {
    const [exId, i, f] = inp.dataset.set.split("|");
    wo.sess = APP.session;
    wo.ex[exId] = wo.ex[exId] || { sets: [] };
    const sets = wo.ex[exId].sets;
    while (sets.length <= +i) sets.push([null, null]);
    const v = parseFloat(inp.value);
    sets[+i][+f] = isNaN(v) ? null : v;
    save();
  }));
  root.querySelectorAll("[data-setok]").forEach(b => b.addEventListener("click", () => {
    const [exId, i] = b.dataset.setok.split("|");
    wo.sess = APP.session;
    wo.ex[exId] = wo.ex[exId] || { sets: [] };
    const sets = wo.ex[exId].sets;
    while (sets.length <= +i) sets.push([null, null]);
    const row = b.closest(".setrow");
    const ins = row.querySelectorAll("input");
    // Beim Abhaken: leere Felder mit Platzhalter (= letzte Leistung/Start) übernehmen
    [0, 1].forEach(f => {
      if (sets[+i][f] == null) {
        const v = parseFloat(ins[f].value) || parseFloat(ins[f].placeholder);
        if (!isNaN(v)) { sets[+i][f] = v; ins[f].value = v; }
      }
    });
    sets[+i][2] = !sets[+i][2];
    b.classList.toggle("on", !!sets[+i][2]);
    save();
  }));
  root.querySelectorAll("[data-addset]").forEach(b => b.addEventListener("click", () => {
    const exId = b.dataset.addset;
    wo.ex[exId] = wo.ex[exId] || { sets: [] };
    wo.ex[exId].sets.push([null, null]);
    save(); vSession();
  }));
  root.querySelectorAll("[data-tech]").forEach(b => b.addEventListener("click", () => {
    document.getElementById("tech-" + b.dataset.tech).classList.toggle("open");
  }));
  root.querySelectorAll("[data-setup]").forEach(t => t.addEventListener("change", () => {
    S.setup[t.dataset.setup] = t.value.trim(); save();
  }));
  root.querySelectorAll("[data-timer]").forEach(b => b.addEventListener("click", () => {
    const t = b.dataset.timer;
    if (t.startsWith("pause")) openTimer("pause", parseInt(t.slice(5)));
    else openTimer(t);
  }));
  document.getElementById("finishbtn").addEventListener("click", () => {
    wo.sess = APP.session;
    wo.done = !wo.done; save(); vSession(); window.scrollTo(0, document.body.scrollHeight);
  });
}

      <div class="seg" style="margin:6px 0 0">${[1, 2, 3, 4].map(s => `<button class="${st === s ? "on" : ""}" data-stufe="${s}">${s}</button>`).join("")}</div>
      <div class="note">${esc(STUFEN_TABLE.find(r => r[0] === "bulk" + st)[1])}: ${esc(STUFEN_TABLE.find(r => r[0] === "bulk" + st)[2])}</div>

      <div class="seg" style="margin:6px 0 0">${[["aufbau", "Aufbau · +0.3–0.35"], ["recomp", "Recomp · halten"]].map(g => `<button class="${goalMode() === g[0] ? "on" : ""}" data-goal="${g[0]}">${g[1]}</button>`).join("")}</div>
      <div class="note">${esc(GOALS[goalMode()].note)}</div>` : ""}

    <h2 class="sec">Die Module</h2>
    ${modCards}

    <h2 class="sec">Hauptmahlzeiten</h2>
    <div class="card">
      ${[["T1", "Mittag"], ["T2", "Abend"]].map(sl => `<div style="${LBL};margin-top:${sl[0] === "T1" ? 0 : 14}px">Standard ${sl[1]}</div>
      <div class="seg" style="margin:6px 0 0">${MEAL_IDS.map(id => `<button class="${S.mealDef[sl[0]] === id ? "on" : ""}" data-mdef="${sl[0]}|${id}">${esc(MEALS[id].short)}</button>`).join("")}</div>`).join("")}
      <div class="note">Gilt ab heute für jeden Tag. Einzelne Tage wechselst du auf «Heute» mit «Mahlzeit wechseln». Schon abgehakte Tage behalten ihre Mahlzeit.</div>

    ${MEAL_IDS.map(id => { const mi = mealInfo(id, n), M = MEALS[id]; return `<button class="card" data-mrec="${id}" style="display:block;width:100%;text-align:left">
      <div class="row"><div class="grow"><b style="font-size:15px">${esc(M.full)}</b>
        <div style="font-size:13px;color:var(--muted);margin-top:2px">≈${fmtK(mi.kcal)} kcal · ${mi.p} g P${M.kh ? " · " + M.kh + " g KH · " + M.f + " g F · " + M.bs + " g Ballaststoffe" : ""}</div>
        <div style="font-size:13px;color:var(--muted)">${M.portions} ${M.portions === 1 ? "Portion" : "Portionen"} · ${esc(M.time)} · ${M.typ === "kalt" ? "❄️ kalt" : "🔥 warm"}</div></div>

    <h2 class="sec">Der Standard-Topf · 3 Portionen</h2>

      <div class="note">Ergibt 3 Portionen à ≈${fmtK(n.T.kcal)} kcal / ${n.T.p} g Protein. Im Aufbau bleibt der Reis bei 2 Tassen: mehr Kalorien kommen über den Abend-Shake.</div>
    </div>
    ${POT.notes.map(x => `<div class="card"><b style="font-size:14.5px">${esc(x[0])}</b><div style="font-size:14px;color:var(--ink2);margin-top:3px">${esc(x[1])}</div></div>`).join("")}

    <h2 class="sec">Phasen & Stufen</h2>
    <div class="card">${stufenRows}
      <div class="note">Aufbau: jeder Tag gleich, auch der Ruhetag. Cut: am Ruhetag ohne Oats, ≈370 kcal weniger.</div></div>

    <h2 class="sec">Timing</h2>
    <div class="card">${TIMING.map(r => `<div class="kv"><span class="k">${esc(r[0])}</span><span class="v" style="font-weight:500;font-size:13.5px;max-width:62%;text-align:left">${esc(r[1])}</span></div>`).join("")}</div>

    <h2 class="sec">Abwechslungs-Pool · ${menus.length} Menüs</h2>
    <div class="note" style="padding:0 4px;margin:-2px 0 8px">Optional für Abwechslung: 1 Menü ersetzt 1 Hauptmahlzeit. Im Aufbau Carbs +40 g roh.</div>
    <div class="seg">${[["alle", "Alle"], ["kalt", "❄️ Kalt"], ["warm", "🔥 Warm"]].map(t => `<button class="${f.typ === t[0] ? "on" : ""}" data-ftyp="${t[0]}">${t[1]}</button>`).join("")}</div>
    <div class="seg">${[["alle", "Alle"], ["fisch", "Fisch"], ["fleisch", "Fleisch"], ["pflanzlich", "Pflanzlich"]].map(t => `<button class="${f.cat === t[0] ? "on" : ""}" data-fcat="${t[0]}">${t[1]}</button>`).join("")}</div>

    <h2 class="sec">Swaps & Bausteine</h2>
    ${SWAPS.map(s => `<div class="card"><b style="font-size:14.5px">${esc(s[0])}</b><div style="font-size:14px;color:var(--ink2);margin-top:3px">${esc(s[1])}</div></div>`).join("")}

    <h2 class="sec">Dressings (ins 10-g-Fett-Budget)</h2>
    <div class="card">${DRESSINGS.map(d => `<div class="kv"><span class="k">${esc(d[0])}</span><span class="v" style="font-weight:500;font-size:13.5px">${esc(d[1])}</span></div>`).join("")}

    <h2 class="sec">Regeln & Logistik</h2>
    ${FOOD_RULES.map(r => `<div class="card"><b style="font-size:14.5px">${esc(r[0])}</b><div style="font-size:14px;color:var(--ink2);margin-top:3px">${esc(r[1])}</div></div>`).join("")}

    <h2 class="sec">Supplemente</h2>
    <div class="card">${PLAN.supps.map(s => `<div class="kv"><span class="k">${esc(s[0])}</span><span class="v" style="font-weight:500;font-size:13.5px;max-width:60%">${esc(s[1])}</span></div>`).join("")}</div>`;

  root.querySelectorAll("[data-stufe]").forEach(b => b.addEventListener("click", () => { S.stufe = +b.dataset.stufe; save(); vFood(); }));
  root.querySelectorAll("[data-goal]").forEach(b => b.addEventListener("click", () => { S.goal = b.dataset.goal; save(); vFood(); }));
  root.querySelectorAll("[data-ftyp]").forEach(b => b.addEventListener("click", () => { APP.menuFilter.typ = b.dataset.ftyp; vFood(); }));
  root.querySelectorAll("[data-fcat]").forEach(b => b.addEventListener("click", () => { APP.menuFilter.cat = b.dataset.fcat; vFood(); }));
  root.querySelectorAll("[data-modcard]").forEach(b => b.addEventListener("click", () => {
    const d = document.getElementById("md-" + b.dataset.modcard);
    d.classList.toggle("open");

  }));
  root.querySelectorAll("[data-menu]").forEach(r => r.addEventListener("click", () => openMenu(+r.dataset.menu)));
  root.querySelectorAll("[data-mdef]").forEach(b => b.addEventListener("click", () => {
    const [sl, id] = b.dataset.mdef.split("|");
    if (S.mealDef[sl] === id) return;
    freezeMeals(sl); S.mealDef[sl] = id;
    const tk = todayKey(); if (S.meal[tk] && S.meal[tk][sl] && !(S.mods[tk] && S.mods[tk][sl])) delete S.meal[tk][sl];
    save(); renderAll();
  }));
  root.querySelectorAll("[data-mrec]").forEach(b => b.addEventListener("click", () => openMeal(b.dataset.mrec)));
}

/* ============ ERHOLUNG ============ */
function vRec() {
  const root = document.getElementById("scr-rec");
  const k = todayKey();
  const ws = weekStats(k);

  const cards = RECOVERY.cards.map(c => {
    let counter = "";
    if (c.counter === "nsdr") {
      counter = `<div class="row" style="margin-top:10px">
        <span class="chip aqua">Diese Woche: ${ws.nsdr}/3</span><div class="grow"></div>
        <button class="minibtn" data-nsdr="1">+1 NSDR heute</button></div>`;
    }
    if (c.counter === "swim") {
      counter = `<div class="row" style="margin-top:10px">
        <span class="chip aqua">Diese Woche: ${ws.swim}× Schwimmen</span><div class="grow"></div>
        <button class="minibtn ${S.swim[k] ? "blue" : ""}" data-swimrec="1">${S.swim[k] ? "✓ Heute geschwommen" : "Heute geschwommen"}</button></div>`;
    }
    if (c.counter === "velo") {
      const vl = veloLvl(k);
      counter = `<div class="row" style="margin-top:10px;flex-wrap:wrap;gap:8px">
        <span class="chip aqua">Diese Woche: ${ws.velo}× Velo${ws.veloLong ? " (" + ws.veloLong + "× lang)" : ""}</span><div class="grow"></div>
        <button class="minibtn ${vl === "kurz" ? "blue" : ""}" data-velorec="kurz">${vl === "kurz" ? "✓ " : ""}Heute kurz</button>
        <button class="minibtn ${vl === "lang" ? "blue" : ""}" data-velorec="lang">${vl === "lang" ? "✓ " : ""}Heute lang</button></div>`;
    }
    if (c.id === "sauna") {
      counter = `<div class="row" style="margin-top:10px">
        <span class="chip aqua">Diese Woche: ${ws.sauna}× Sauna</span><div class="grow"></div>
        <button class="minibtn" data-sauna="1">Heute wars ${S.sauna[k] ? S.sauna[k] + " Gänge" : "— eintragen"}</button></div>`;
    }
    return `<div class="card reccard">
      <div class="row"><span style="font-size:20px">${c.icon}</span><b style="font-size:16.5px">${esc(c.name)}</b></div>
      <div class="fr">${esc(c.freq)}</div>
      <ul>${c.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
      ${c.link ? `<a href="${c.link[1]}" target="_blank" rel="noopener" style="font-size:14px">🔗 ${esc(c.link[0])}</a>` : ""}
      ${counter}
      ${c.timer ? `<button class="btn ghost" data-rectimer="${c.id}">⏱ ${esc(c.timer.label)}</button>` : ""}
    </div>`;
  }).join("");

  root.innerHTML = `
    <div class="ltitle">Erholung</div>
    <div class="lsub">Schlaf und Stressmanagement sind Trainingsbestandteil — dein limitierender Faktor</div>${healthRecBlock(k)}

    <div class="card pad0"><table class="weektable">${(k < PLAN_SWITCH ? RECOVERY.weekOld : RECOVERY.week).map((r, i) => `<tr ${((today().getDay() + 6) % 7) === i ? 'style="background:var(--blue-dim)"' : ""}><td class="wd">${r[0]}</td><td class="tr">${esc(r[1])}</td><td class="rec">${esc(r[2])}</td></tr>`).join("")}</table></div>

    ${cards}

    <h2 class="sec">${esc(RECOVERY.evening.title)}</h2>
    <div class="card">
      ${RECOVERY.evening.steps.map(s => `<div class="kv"><span class="k" style="font-variant-numeric:tabular-nums">${s[0]}</span><span class="v" style="text-align:left;flex:1;font-weight:500;font-size:14px">${esc(s[1])}</span></div>`).join("")}
      <div class="note">${esc(RECOVERY.evening.note)}</div>
      <button class="btn ghost" data-rectimer="breath-direct">🌬️ 4-7-8-Atmung starten</button>
    </div>

    <h2 class="sec">${esc(SUNDAY.title)}</h2>
    <div class="card"><ul style="margin:2px 0 2px 18px;color:var(--ink2);font-size:14.5px">${SUNDAY.items.map(i => `<li style="margin-bottom:5px">${esc(i)}</li>`).join("")}</ul></div>`;

  root.querySelectorAll("[data-nsdr]").forEach(b => b.addEventListener("click", () => { S.nsdr[k] = (S.nsdr[k] || 0) + 1; save(); vRec(); }));
  root.querySelectorAll("[data-sauna]").forEach(b => b.addEventListener("click", () => { S.sauna[k] = (S.sauna[k] || 0) + 1; save(); vRec(); }));
  root.querySelectorAll("[data-swimrec]").forEach(b => b.addEventListener("click", () => {
    if (S.swim[k]) { delete S.swim[k]; if (S.mods[k]) delete S.mods[k].W; } else S.swim[k] = 1;
    save(); vRec();
  }));
  root.querySelectorAll("[data-velorec]").forEach(b => b.addEventListener("click", () => {
    const v = b.dataset.velorec;
    if (veloLvl(k) === v) { delete S.velo[k]; if (S.mods[k]) delete S.mods[k].V; } else S.velo[k] = v;
    save(); vRec();
  }));
  root.querySelectorAll("[data-rectimer]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.rectimer;
    if (id === "breath-direct") return openTimer("breath");
    const c = RECOVERY.cards.find(x => x.id === id);
    if (c && c.timer) openTimer(c.timer.type, (c.timer.min || 10) * 60, c.name);
  }));
  root.querySelectorAll("[data-health-all]").forEach(b => b.addEventListener("click", healthAllSheet));
}

/* ============ FORTSCHRITT, CHART, SHEETS, TIMER, EXPORT ============ */
"use strict";

/* ---------- Fortschritt ---------- */
function vProg() {
  const k = todayKey(); const root = document.getElementById("scr-prog");
  const a7 = weightAvg(k, 7);
  const prev7 = weightAvg(addDays(k, -7), 7);
  const d = (a7 != null && prev7 != null) ? a7 - prev7 : null;
  const p = phaseFor(k);
  const ws = weekStats(k);
  const waistKeys = Object.keys(S.waist).sort();
  const lastWaist = waistKeys.length ? waistKeys[waistKeys.length - 1] : null;
  const shR = shRatio(k), PH = PLAN.physique;
  const phRows = PH.ladder.map(r => `<div class="kv"><span class="k">${esc(r[0])}</span><span class="v" style="font-weight:500;font-size:13.5px;max-width:64%;text-align:right"><b>${esc(r[1])}</b> Magermasse · ${esc(r[2])}</span></div>`).join("");

  const deltaHtml = d == null ? `<span class="delta flat">Vorwoche: noch zu wenig Daten</span>`
    : `<span class="delta ${d < -0.05 ? "down" : d > 0.05 ? "up" : "flat"}">${d > 0 ? "+" : ""}${fmt1(d)} kg vs. Vorwoche</span>`;

  let rateHint = "";
  const pr = rateFor(p);
  if (d != null && pr) {
    const lo = Math.min(...pr), hi = Math.max(...pr), rc = p.id === "bulk" && goalMode() === "recomp", ab = p.id === "bulk" && !rc;
    const loT = ab ? 0.25 : lo - 0.15, hiT = ab ? 0.5 : hi + 0.15;   // Aufbau: Stufenregel ab 22.10. (unter +0.25 / über +0.5)
    if (d < loT) rateHint = rc ? "Du nimmst ab — im Recomp nicht das Ziel. Mehr essen: siehe «Energie diese Woche» auf Heute. Hält es 2 Wochen an: eine Stufe hoch." : ab ? "Unter +0.25 kg/Wo — hält das 2 Wochen an: eine Stufe hoch (Ernährung → Stufe" + (curStufe() < STUFE_MAX ? " " + (curStufe() + 1) : "") + ")." : "Schneller als geplant — >0.8 kg/Wo wäre +150 kcal.";
    else if (d > hiT) rateHint = rc ? "Schneller als Recomp-Tempo — hält das 2 Wochen an: eine Stufe zurück." : ab ? "Über +0.5 kg/Wo — eine Stufe zurück." : "Zu langsam — nach 2 Wochen unter 0.3 kg/Wo: Reis 1.5 → 1.25 Tassen.";
    else if (ab && d < lo) rateHint = "Knapp unter dem Korridor (" + fmtRate(pr) + " kg/Wo) — noch kein Grund für eine neue Stufe.";
    else rateHint = "Im Zielkorridor (" + fmtRate(pr) + " kg/Wo) — weiter so.";
    if (p.id === "bulk" && diffDays(p.from, k) < 21) rateHint = "Erste 3 Wochen nach dem Cut: +1–1.5 kg sind Glykogen und Wasser, kein Fett. Die Stufenregel greift erst danach. " + rateHint;
  }

  const cpRows = PLAN.checkpoints.map(c => {
    const past = c.date < k, next = nextCheckpoint(k) && nextCheckpoint(k).date === c.date;
    return `<div class="tlrow ${past ? "past" : next ? "next" : ""}">
      <div class="d">${fmtDateY(c.date)} · in ${diffDays(k, c.date) >= 0 ? diffDays(k, c.date) + " Tagen" : "vorbei"}</div>
      <div class="l">${esc(c.label)}</div><div class="dt">${esc(c.detail)}</div></div>`;
  }).join("");

  root.innerHTML = `
    <div class="ltitle">Fortschritt</div>
    <div class="lsub">${esc(PLAN.goal27)}</div>
    <div class="card hero">
      <div class="lbl">7-Tage-Durchschnitt</div>
      <div class="val">${a7 != null ? fmt1(a7) : "—"}<small> kg</small></div>
      ${deltaHtml}
      ${rateHint ? `<div class="note">${esc(rateHint)}</div>` : ""}
    </div>

    <div class="card pad0" style="padding:12px 8px 4px">
      <div class="seg" style="margin:0 8px 8px">${[[28, "4 Wochen"], [84, "12 Wochen"], [0, "Alles"]].map(r => `<button class="${APP.chartRange === r[0] ? "on" : ""}" data-crange="${r[0]}">${r[1]}</button>`).join("")}</div>
      <div class="legend" style="padding-left:12px"><span class="k"><span class="lk"></span>7-Tage-Ø</span><span class="k"><span class="lk dot"></span>Tageswert</span><span class="k"><span class="lk band"></span>Ziel-Korridor</span></div>
      <div class="chartwrap" id="chartwrap"><div class="charttip" id="charttip"></div></div>
    </div>

    <div class="statgrid">
      <div class="stat"><div class="lbl">Trainings diese Woche</div><div class="val">${ws.trainDone}<span style="color:var(--muted);font-size:15px">/${ws.trainTarget}</span></div></div>
      <div class="stat"><div class="lbl">Module diese Woche</div><div class="val">${ws.modPct != null ? ws.modPct + "%" : "—"}</div><div class="sub">${ws.modHit}/${ws.modTot} abgehakt</div></div>
      <div class="stat"><div class="lbl">Schlaf Ø</div><div class="val">${ws.sleepH ? fmt1(ws.sleepH) + " h" : "—"}</div><div class="sub">${ws.sleepQ ? "Qualität " + fmt1(ws.sleepQ) + "/5" : "Ziel 7:45–8:30"}</div></div>
      <div class="stat"><div class="lbl">Taille</div><div class="val">${lastWaist ? fmt1(S.waist[lastWaist]) : "—"}<span style="color:var(--muted);font-size:15px"> cm</span></div><div class="sub">${lastWaist ? fmtDate(lastWaist) : "sonntags messen"}${shR ? " · Schulter:Taille " + fmt2(shR) : ""}</div></div>
    </div>

    <h2 class="sec">Umfänge eintragen <span style="text-transform:none;letter-spacing:0">· von Hand</span></h2>
    <div class="card">${measCard(k)}
      <button class="btn" id="waistsave">Speichern</button>
      <div class="note">Taille jeden Sonntag, Schulter, Arm, Brust und Oberschenkel einmal im Monat mit den Fotos. Immer gleiche Stelle, gleiche Tageszeit. Schulter : Taille ist dein V-Form-Mass, Ziel ≥ ${fmt2(PH.ratio)}.</div>
    </div>

    <h2 class="sec">Wochen-Review & Check-in</h2>
    <div class="card">
      <div style="font-size:14px;color:var(--ink2)">Sonntag 17:00: Export kopieren und im Check-in mit Coach Claude einfügen — dann passen wir den Plan an.</div>
      <button class="btn" id="exportbtn">Wochen-Export erstellen</button>
    </div>

    <h2 class="sec">Meilensteine</h2>
    <div class="card"><div class="tl">${cpRows}</div>
      <div class="note" style="margin-top:10px">${esc(PLAN.monthly)}</div>
      <div class="note">${esc(PLAN.northstar)}</div></div>

    <h2 class="sec">Zielbild · Langfrist-Plan</h2>
    <div class="card">${phRows}
      <div class="divider"></div>
      <div class="kv"><span class="k">Schulter : Taille</span><span class="v">${shR ? fmt2(shR) : "—"} <span style="color:var(--muted);font-weight:500">· Ziel ≥ ${fmt2(PH.ratio)}</span></span></div>
      ${!shR ? `<div class="note">Schulter und Taille oben eintragen, dann erscheint dein Wert.</div>` : ""}
      <ul style="margin:10px 0 0 18px;color:var(--ink2);font-size:14px">${PH.notes.map(x => `<li style="margin-bottom:4px">${esc(x)}</li>`).join("")}</ul>
      <div class="note">Magermasse = Schätzung (Gewicht × (1 − KF)); die seca-Scans liefern die echten Werte.</div></div>

    <h2 class="sec">Daten</h2>
    <div class="card">
      ${bkStatHtml("")}
      <button class="btn ghost" id="backupbtn">Backup sichern / laden</button>
      <div class="note">Deine Daten liegen nur auf diesem Gerät. Einmal pro Woche als Datei in iCloud Drive sichern, dann übersteht alles auch ein neues iPhone.</div>
    </div>`;

  drawChart();
  root.querySelectorAll("[data-crange]").forEach(b => b.addEventListener("click", () => { APP.chartRange = +b.dataset.crange; vProg(); }));
  bindSteppers(root);
